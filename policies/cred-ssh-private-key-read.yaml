apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: moat-cred-ssh-private-key-read
  annotations:
    moat.omarchy/severity: "high"
    moat.omarchy/title: "Private SSH key read by an unexpected program"
    moat.omarchy/rotate: "ssh-key"
    moat.omarchy/enforce: "deny"
    moat.omarchy/actions: "kill,quarantine,ignore"
    moat.omarchy/why: >-
      Private keys are the first thing npm and PyPI stealers read; only ssh, git and a
      few backup tools ever need them, and a key that leaves the machine gives an
      attacker every host and forge you can reach.
    moat.omarchy/expected: >-
      Backup tools (restic, borg), IDE git integrations, ansible/terraform runs, and
      custom scripts that call an ssh library instead of the ssh binary.
    moat.omarchy/fp-hint: "exe"
spec:
  options:
  - name: "policy-mode"
    value: "monitor"
  lsmhooks:
  - hook: "file_post_open"
    message: "Private SSH key opened for reading"
    args:
    - index: 0
      type: "file"
    - index: 1
      type: "int"
    selectors:
    - matchBinaries:
      - operator: "NotPostfix"
        values:
        - "/ssh"
        - "/sshd"
        - "/ssh-add"
        - "/ssh-agent"
        - "/ssh-keygen"
        - "/ssh-keyscan"
        - "/ssh-pkcs11-helper"
        - "/scp"
        - "/sftp"
        - "/rsync"
        - "/git"
        - "/git-remote-http"
        - "/gpg-agent"
        - "/keychain"
      matchArgs:
      - index: 0
        operator: "Equal"
        values:
        - "{{HOME}}/.ssh/id_rsa"
        - "{{HOME}}/.ssh/id_dsa"
        - "{{HOME}}/.ssh/id_ecdsa"
        - "{{HOME}}/.ssh/id_ecdsa_sk"
        - "{{HOME}}/.ssh/id_ed25519"
        - "{{HOME}}/.ssh/id_ed25519_sk"
        - "{{HOME}}/.ssh/identity"
      - index: 1
        operator: "Mask"
        values: ["4"]
      matchActions:
      # Deny the READ, do not kill the reader.
      #
      # -13 is -EACCES: `security_file_post_open` is called from `do_open()`,
      # so a non-zero return fails the open() and no file descriptor is ever
      # installed. The bytes are not read. That is the same prevention Sigkill
      # gave, without the collateral: on 2026-09-05 this policy was armed with
      # Sigkill and would have killed `grep -r ~`, restic and borg outright --
      # none of them are in the exclusion list below, and a backup dying
      # halfway through is a worse outcome than a backup that skips one file
      # and says so.
      #
      # It also leaves the process alive to be looked at, which is this
      # project's stated preference everywhere else: a refused action you can
      # investigate beats a dead process you cannot.
      - action: Override
        argError: -13
