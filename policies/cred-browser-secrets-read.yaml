apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: sentinel-cred-browser-secrets-read
  annotations:
    sentinel.omarchy/severity: "high"
    sentinel.omarchy/title: "Browser password or cookie store read by a non-browser"
    sentinel.omarchy/rotate: "browser-passwords,browser-cookies,session-cookies"
    sentinel.omarchy/enforce: "none"
    sentinel.omarchy/actions: "kill,quarantine,ignore"
    sentinel.omarchy/why: >-
      Session cookies are the payload every commodity infostealer wants: they bypass
      your password and your second factor, and the files sit at a predictable name
      inside the browser profile.
    sentinel.omarchy/expected: >-
      The browsers themselves, password managers importing your logins, and backup
      tools. Any path whose last component is one of these names matches, so an
      unrelated file called Cookies will also fire.
    sentinel.omarchy/fp-hint: "exe+file"
spec:
  options:
  - name: "policy-mode"
    value: "monitor"
  lsmhooks:
  - hook: "file_post_open"
    message: "Browser credential or cookie store opened for reading"
    args:
    - index: 0
      type: "file"
    - index: 1
      type: "int"
    selectors:
    - matchBinaries:
      - operator: "NotPostfix"
        values:
        - "/firefox"
        - "/firefox-bin"
        - "/librewolf"
        - "/zen-bin"
        - "/thunderbird"
        - "/plugin-container"
        - "/chromium"
        - "/chrome"
        - "/google-chrome-stable"
        - "/brave"
        - "/vivaldi-bin"
        - "/opera"
        - "/microsoft-edge"
        - "/keepassxc"
        - "/bitwarden"
        - "/1password"
      matchArgs:
      - index: 0
        operator: "Postfix"
        values:
        - "/logins.json"
        - "/key4.db"
        - "/key3.db"
        - "/cert9.db"
        - "/signons.sqlite"
        - "/cookies.sqlite"
        - "/Login Data"
        - "/Login Data For Account"
        - "/Cookies"
        - "/Web Data"
        - "/Local State"
      - index: 1
        operator: "Mask"
        values: ["4"]
      matchActions:
      - action: Post
        rateLimit: "60s"
        rateLimitScope: "process"
