apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: sentinel-priv-setcap-xattr
  annotations:
    sentinel.omarchy/severity: "high"
    sentinel.omarchy/title: "File capability set on a binary"
    sentinel.omarchy/enforce: "none"
    sentinel.omarchy/actions: "kill,quarantine,ignore"
    sentinel.omarchy/why: >-
      security.capability is setuid without the obvious bit: cap_setuid or cap_sys_admin
      on a private copy of a binary is a quiet, permanent privilege escalation that no
      permission listing makes obvious.
    sentinel.omarchy/expected: >-
      pacman extracting a package that ships capabilities, and you running setcap by
      hand for a profiler, a debugger or a network tool.
    sentinel.omarchy/fp-hint: "exe"
spec:
  options:
  - name: "policy-mode"
    value: "monitor"
  lsmhooks:
  - hook: "inode_setxattr"
    message: "security.capability extended attribute written"
    args:
    - index: 1
      type: "dentry"
    - index: 2
      type: "string"
    selectors:
    - matchBinaries:
      - operator: "NotIn"
        values:
        - "/usr/bin/pacman"
        - "/usr/bin/bsdtar"
        - "/usr/bin/tar"
      matchArgs:
      - index: 2
        operator: "Equal"
        values: ["security.capability"]
      matchActions:
      - action: Post
        rateLimit: "60s"
        rateLimitScope: "process"
