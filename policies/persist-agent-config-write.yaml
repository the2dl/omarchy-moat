apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: moat-persist-agent-config-write
  annotations:
    moat.omarchy/severity: "medium"
    moat.omarchy/title: "AI agent or editor task configuration written"
    moat.omarchy/enforce: "none"
    moat.omarchy/actions: "quarantine,ignore"
    moat.omarchy/why: >-
      CLAUDE.md, .claude/settings.json, .mcp.json and .vscode/tasks.json are executed or
      obeyed by tools that already have your permissions; a hook or MCP server added
      there is prompt-injection with a shell attached.
    moat.omarchy/expected: >-
      Very often. The agents themselves rewrite these files, and so does every project
      you clone that ships one.
    moat.omarchy/fp-hint: "exe+file"
spec:
  options:
  - name: "policy-mode"
    value: "monitor"
  kprobes:
  - call: "security_file_post_open"
    syscall: false
    message: "AI agent or editor task configuration opened for writing"
    args:
    - index: 0
      type: "file"
    - index: 1
      type: "int"
    selectors:
    - matchBinaries:
      - operator: "NotPostfix"
        values:
        - "/nvim"
        - "/vim"
        - "/nano"
        - "/emacs"
        - "/code"
        - "/zed"
        - "/hx"
      matchArgs:
      - index: 0
        operator: "Postfix"
        values:
        - "/.claude/settings.json"
        - "/.claude/settings.local.json"
        - "/.claude/hooks.json"
        - "/.mcp.json"
        - "/CLAUDE.md"
        - "/AGENTS.md"
        - "/.vscode/tasks.json"
        - "/.vscode/launch.json"
        - "/.cursor/mcp.json"
      - index: 1
        operator: "Mask"
        values: ["2"]
      matchActions:
      - action: Post
        rateLimit: "300s"
        rateLimitScope: "process"
