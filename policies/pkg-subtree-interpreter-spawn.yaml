apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: sentinel-pkg-subtree-interpreter-spawn
  annotations:
    sentinel.omarchy/severity: "low"
    sentinel.omarchy/title: "Package manager spawned a shell or interpreter"
    sentinel.omarchy/enforce: "none"
    sentinel.omarchy/actions: "ignore"
    sentinel.omarchy/why: >-
      Install-time scripts are where supply-chain payloads run. On its own a shell under
      npm or cargo is normal, so this is a timeline signal: sentineld escalates it when
      the same subtree also reads a credential or connects out.
    sentinel.omarchy/expected: >-
      Constantly. Every npm lifecycle script, node-gyp build, cargo build script and pip
      setup.py runs a shell or a python interpreter.
    sentinel.omarchy/fp-hint: "rule"
spec:
  options:
  - name: "policy-mode"
    value: "monitor"
  lsmhooks:
  - hook: "bprm_check_security"
    message: "Shell or interpreter executed inside a package manager process tree"
    args:
    - index: 0
      type: "linux_binprm"
    selectors:
    - matchParentBinaries:
      - operator: "In"
        followChildren: true
        values:
        - "/usr/bin/npm"
        - "/usr/bin/npx"
        - "/usr/bin/pnpm"
        - "/usr/bin/yarn"
        - "/usr/bin/bun"
        - "/usr/bin/node"
        - "/usr/local/bin/node"
        - "/usr/bin/pip"
        - "/usr/bin/pip3"
        - "/usr/bin/uv"
        - "/usr/bin/cargo"
        - "/usr/bin/makepkg"
      matchArgs:
      - index: 0
        operator: "Postfix"
        values:
        - "/sh"
        - "/bash"
        - "/zsh"
        - "/dash"
        - "/fish"
        - "/busybox"
        - "/python"
        - "/python3"
        - "/perl"
        - "/ruby"
        - "/bun"
      matchActions:
      - action: Post
        rateLimit: "300s"
        rateLimitScope: "process"
