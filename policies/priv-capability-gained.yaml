apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: moat-priv-capability-gained
  annotations:
    moat.omarchy/severity: "high"
    moat.omarchy/title: "A process requested additional effective capabilities"
    moat.omarchy/enforce: "none"
    moat.omarchy/actions: "kill,ignore"
    moat.omarchy/namespace: "global"
    moat.omarchy/why: >-
      A process requested effective capabilities it did not previously hold in
      the host user namespace. This can make privileged operations available
      without executing a new program. The event records the request, not proof
      that the kernel granted it or that an exploit succeeded.
    moat.omarchy/expected: >-
      Privileged programs may enable capabilities already in their permitted
      set. Capability drops do not match. Requests made from a child user
      namespace do not match. Check the old and requested sets and the caller.
    moat.omarchy/fp-hint: "exe"
spec:
  options:
  - name: "policy-mode"
    value: "monitor"
  kprobes:
  # Tetragon v1.7.1 testCapabilitiesGained uses this exact argument pair.
  # matchCapabilityChanges compares cached/current sets in BOTH directions:
  # it cannot support a claim that a capability was gained. security_capset
  # exposes the old credentials and proposed effective set directly.
  - call: "security_capset"
    syscall: false
    message: "A process requested additional effective capabilities"
    args:
    - index: 1
      type: "cap_effective"
      resolve: "cap_effective"
      label: "old_effective"
    - index: 2
      type: "cap_effective"
      label: "requested_effective"
    selectors:
    - matchNamespaces:
      - namespace: User
        operator: "In"
        values:
        - "host_ns"
      matchArgs:
      - args: [0, 1]
        operator: "CapabilitiesGained"
      matchActions:
      - action: Post
