apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: moat-priv-sysctl-write
  annotations:
    moat.omarchy/severity: "high"
    moat.omarchy/title: "Kernel tunable written by an unexpected program"
    moat.omarchy/enforce: "none"
    moat.omarchy/actions: "kill,ignore"
    # There is one kernel. /proc/sys/kernel is not namespaced -- a container
    # writing core_pattern sets what the HOST runs on the next crash -- so this
    # is a fact about this machine wherever it happens, exactly like a module
    # load or a BPF program load. scoring::GLOBAL_RULES must list it, and
    # global_rules_match_the_annotated_policies fails if it does not.
    moat.omarchy/namespace: "global"
    moat.omarchy/why: >-
      /proc/sys/kernel/core_pattern is the best-known write-to-root primitive there
      is: a pipe there runs as root on the next crash, and it works from inside a
      container as well as on the host. kernel/modprobe replaces the binary the
      kernel calls to autoload a module. Nothing writes these after boot except
      systemd-sysctl and sysctl, so a write by anything else is not a tuning
      change, it is somebody arranging to be root later.
    moat.omarchy/expected: >-
      systemd-sysctl applying /etc/sysctl.d at boot, and `sysctl -w` run by hand.
      Both are excluded by name. Container runtimes writing net.* are not matched,
      and neither is /proc/sys/kernel/ns_last_pid, which moat's own pidfd test
      writes on every build.
    moat.omarchy/fp-hint: "exe"
spec:
  options:
  - name: "policy-mode"
    value: "monitor"
  lsmhooks:
  # file_post_open, which takes this hook from 8/19 to 9/19 -- ten short of the
  # BPF trampoline cap (NOTES section 3). The LSM boundary rather than a kprobe
  # on security_file_post_open, because this is a rule that may one day want to
  # refuse: Override needs the LSM hook and a kprobe cannot do it.
  - hook: "file_post_open"
    message: "Kernel tunable written by an unexpected program"
    args:
    - index: 0
      type: "file"
    - index: 1
      type: "int"
    selectors:
    - matchBinaries:
      - operator: "NotIn"
        values:
        - "/usr/lib/systemd/systemd-sysctl"
        - "/usr/bin/sysctl"
        - "/usr/bin/systemd-sysctl"
      matchArgs:
      # ENUMERATED, not a prefix over /proc/sys/kernel/.
      #
      # The prefix was the first shape and it was wrong. On 2026-09-10 it fired
      # on moat's OWN test suite: util::pidfd_tests writes
      # /proc/sys/kernel/ns_last_pid to force a pid to be recycled, under
      # makepkg -> cargo, so every package build of moat would have raised a
      # high alert about moat. ns_last_pid is not an escalation path; it is a
      # counter, used by that test and by CRIU.
      #
      # Two filters on one index is UNVERIFIED at runtime (notes section 2) and
      # check.py flags it, so an exclusion alongside the prefix was not on
      # offer. Equal with a named list is: string Equal values are map-backed
      # with no four-value cap, and every one of these is a documented path to
      # running code as root. The cost is that a tunable nobody has thought of
      # is not covered, which is the honest trade for not crying wolf on a
      # build.
      - index: 0
        operator: "Equal"
        values:
        # Run as root on the next crash.
        - "/proc/sys/kernel/core_pattern"
        - "/proc/sys/kernel/core_pipe_limit"
        # What the kernel executes to autoload a module.
        - "/proc/sys/kernel/modprobe"
        - "/proc/sys/kernel/modules_disabled"
        # Re-opening the gates this machine's exploits would come through.
        - "/proc/sys/kernel/unprivileged_userns_clone"
        - "/proc/sys/kernel/unprivileged_bpf_disabled"
        - "/proc/sys/kernel/kexec_load_disabled"
        # Blinding the defences, which is what precedes the rest.
        - "/proc/sys/kernel/kptr_restrict"
        - "/proc/sys/kernel/dmesg_restrict"
        - "/proc/sys/kernel/perf_event_paranoid"
        - "/proc/sys/kernel/yama/ptrace_scope"
        - "/proc/sys/kernel/sysrq"
        - "/proc/sys/kernel/ftrace_enabled"
        # Not under kernel/, and a real exploit primitive: userfaultfd is how a
        # race is held open long enough to win.
        - "/proc/sys/vm/unprivileged_userfaultfd"
      # MAY_WRITE. The mask is what makes this rule viable at all: /usr/bin/runc
      # reads /proc/sys/kernel/cap_last_cap twelve times in ten seconds on an
      # idle desktop, and every one of those is mask 4.
      - index: 1
        operator: "Mask"
        values: ["2"]
      matchActions:
      - action: Post
