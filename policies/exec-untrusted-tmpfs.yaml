apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: moat-exec-untrusted-tmpfs
  annotations:
    moat.omarchy/severity: "high"
    moat.omarchy/title: "Binary executed from /tmp, /var/tmp or /dev/shm"
    moat.omarchy/enforce: "none"
    moat.omarchy/actions: "kill,quarantine,ignore"
    moat.omarchy/why: >-
      World-writable directories are where a dropper lands its second stage; /dev/shm in
      particular is memory-backed and leaves nothing on disk to find afterwards.
    moat.omarchy/expected: >-
      Build systems. autoconf configure tests, cargo and go temporary test binaries,
      makepkg builds run from /tmp, AppImage extraction, and installer scripts you piped
      to a shell yourself.
    moat.omarchy/fp-hint: "exe"
    # BASELINE 4: a building block, not a detection. Weak alone: every build writes and
    # runs binaries in /tmp. It exists to be a chain step - and inside a package install
    # the context matrix makes it a detection again, which is the case it was written for.
    moat.omarchy/tier: "signal"
spec:
  options:
  - name: "policy-mode"
    value: "monitor"
  lsmhooks:
  - hook: "bprm_check_security"
    message: "Executable started from a world-writable temporary directory"
    args:
    - index: 0
      type: "linux_binprm"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "/tmp/"
        - "/var/tmp/"
        - "/dev/shm/"
      matchActions:
      - action: Post
        rateLimit: "60s"
        rateLimitScope: "process"
