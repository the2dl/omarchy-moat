apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: moat-persist-omarchy-hooks-write
  annotations:
    moat.omarchy/severity: "high"
    moat.omarchy/title: "Omarchy event hook script written by a non-editor"
    moat.omarchy/enforce: "none"
    moat.omarchy/actions: "kill,quarantine,ignore"
    moat.omarchy/why: >-
      Scripts in ~/.config/omarchy/hooks are executed by Omarchy on system events -
      theme change, login, resume, package update. Dropping a file here is arbitrary
      code execution on a schedule you do not control, with no unit file to notice.
    moat.omarchy/expected: >-
      Your editor writing a hook on purpose, and the omarchy-* helper scripts
      (suppressed in-kernel by the first selector) installing or migrating one.
    moat.omarchy/fp-hint: "exe"
spec:
  options:
  - name: "policy-mode"
    value: "monitor"
  lsmhooks:
  - hook: "file_post_open"
    message: "Omarchy event hook script opened for writing"
    args:
    - index: 0
      type: "file"
    - index: 1
      type: "int"
    selectors:
    - matchBinaries:
      - operator: "Prefix"
        values:
        - "/usr/bin/omarchy-"
        - "/usr/share/omarchy/"
      matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "{{HOME}}/.config/omarchy/hooks/"
      - index: 1
        operator: "Mask"
        values: ["2"]
      matchActions:
      - action: NoPost
    - matchBinaries:
      - operator: "NotPostfix"
        values:
        - "/nvim"
        - "/vim"
        - "/nano"
        - "/emacs"
        - "/code"
        - "/zed"
        - "/hx"
        - "/kate"
        - "/quickshell"
        - "/omarchy-shell"
        - "/hyprctl"
        - "/pacman"
      matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "{{HOME}}/.config/omarchy/hooks/"
      - index: 1
        operator: "Mask"
        values: ["2"]
      matchActions:
      - action: Post
        rateLimit: "60s"
        rateLimitScope: "process"
