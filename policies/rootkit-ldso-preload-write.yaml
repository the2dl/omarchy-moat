apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: moat-rootkit-ldso-preload-write
  annotations:
    moat.omarchy/severity: "critical"
    moat.omarchy/title: "/etc/ld.so.preload created or modified"
    moat.omarchy/enforce: "kill"
    moat.omarchy/actions: "kill,quarantine,ignore"
    moat.omarchy/why: >-
      /etc/ld.so.preload injects a shared object into every dynamically linked program
      on the machine. It does not exist on a clean Arch install, and the classic
      userland rootkits (Jynx, Azazel, HiddenWasp) all start by writing it.
    moat.omarchy/expected: >-
      Nothing on a normal desktop. A few commercial agents and some libc debugging
      setups use it.
    moat.omarchy/fp-hint: "exe"
spec:
  options:
  - name: "policy-mode"
    value: "monitor"
  lsmhooks:
  - hook: "file_post_open"
    message: "/etc/ld.so.preload opened for writing"
    args:
    - index: 0
      type: "file"
    - index: 1
      type: "int"
    selectors:
    - matchBinaries:
      - operator: "NotIn"
        values:
        - "/usr/bin/pacman"
      matchArgs:
      - index: 0
        operator: "Equal"
        values: ["/etc/ld.so.preload"]
      - index: 1
        operator: "Mask"
        values: ["2"]
      matchActions:
      - action: Sigkill
