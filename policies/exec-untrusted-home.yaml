apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: sentinel-exec-untrusted-home
  annotations:
    sentinel.omarchy/severity: "medium"
    sentinel.omarchy/title: "Binary executed from a cache or download directory"
    sentinel.omarchy/enforce: "none"
    sentinel.omarchy/actions: "kill,quarantine,ignore"
    sentinel.omarchy/why: >-
      Nothing in ~/Downloads was reviewed and nothing in ~/.cache is meant to be code
      you run; a payload that lands in either and then executes is the last step before
      it has your session.
    sentinel.omarchy/expected: >-
      Frequently. Playwright, Cypress, Puppeteer, bun, uv, mise and electron-builder all
      keep executables under ~/.cache and run them during ordinary builds.
    sentinel.omarchy/fp-hint: "exe"
spec:
  options:
  - name: "policy-mode"
    value: "monitor"
  lsmhooks:
  - hook: "bprm_check_security"
    message: "Executable started from a cache or download directory"
    args:
    - index: 0
      type: "linux_binprm"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "{{HOME}}/Downloads/"
        - "{{HOME}}/.cache/"
        - "{{HOME}}/.local/share/Trash/"
      matchActions:
      - action: Post
        rateLimit: "300s"
        rateLimitScope: "process"
