apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: moat-rootkit-kernel-module-load
  annotations:
    # There is ONE kernel. A module or BPF program loaded from inside a
    # container is loaded on this machine, so this policy's object has no
    # namespace to be scoped to. Without this, the container-enforcement split
    # in render.rs would demote it to monitor for anyone who can start a
    # container -- which is the cheapest possible way to load a rootkit and be
    # merely watched doing it.
    moat.omarchy/namespace: "global"
    moat.omarchy/severity: "critical"
    moat.omarchy/title: "Kernel module loaded by a binary that is not kmod"
    moat.omarchy/enforce: "kill"
    moat.omarchy/actions: "kill,quarantine,ignore"
    moat.omarchy/why: >-
      A loadable module is total control of the machine, below anything this sensor can
      see. Only kmod, systemd and mkinitcpio have any business loading one; Arch modules
      are zstd-compressed, so the compressed read id is matched too.
    moat.omarchy/expected: >-
      dkms and out-of-tree driver installs (NVIDIA, VirtualBox, v4l2loopback) if they
      call insmod through a wrapper that is not in the allowlist.
    moat.omarchy/fp-hint: "exe"
spec:
  options:
  - name: "policy-mode"
    value: "monitor"
  kprobes:
  - call: "security_kernel_read_file"
    syscall: false
    message: "Kernel module read for loading by an unexpected binary"
    args:
    - index: 0
      type: "file"
    - index: 1
      type: "int"
    selectors:
    - matchBinaries:
      - operator: "NotIn"
        values:
        - "/usr/bin/kmod"
        - "/usr/bin/modprobe"
        - "/usr/bin/insmod"
        - "/usr/bin/depmod"
        - "/usr/bin/mkinitcpio"
        - "/usr/bin/dkms"
        - "/usr/lib/systemd/systemd"
        # SYMLINK to ../../bin/udevadm, and matchBinaries compares the
        # RESOLVED path, so this entry has never matched anything. udev's
        # built-in `kmod load` handler was therefore killed BY THIS RULE: on
        # 2026-09-09, two SIGKILLed udev workers (systemd-udevd[1070]: "Worker
        # [14202] terminated by signal 9") and a Logitech HID device left with
        # no driver. The name is kept because it is what the intent reads as;
        # /usr/bin/udevadm is what the kernel actually reports.
        #
        # udevadm is wider than the entry it repairs -- systemd-udevd could
        # only ever be the daemon, udevadm is also the user CLI. It grants
        # nothing new: anyone who can run udevadm as root to load a module can
        # run modprobe, which resolves to the already-listed /usr/bin/kmod.
        - "/usr/lib/systemd/systemd-udevd"
        - "/usr/bin/udevadm"
        - "/usr/lib/systemd/systemd-modules-load"
      matchArgs:
      - index: 1
        operator: "Equal"
        values: ["2", "7"]
      matchActions:
      - action: Sigkill
