apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: sentinel-cred-registry-token-read
  annotations:
    sentinel.omarchy/severity: "medium"
    sentinel.omarchy/title: "Package-registry or container-registry token read"
    sentinel.omarchy/rotate: "npm-token,pypi-token,cargo-token,docker-token"
    sentinel.omarchy/enforce: "none"
    sentinel.omarchy/actions: "quarantine,ignore"
    sentinel.omarchy/why: >-
      A publish token in .npmrc, .pypirc, .cargo/credentials or docker config.json lets
      an attacker publish a malicious version of a package you own, which is how a
      single compromised laptop becomes a supply-chain incident.
    sentinel.omarchy/expected: >-
      Very often. npm, pnpm, yarn, bun, pip, uv, poetry, cargo, docker and podman read
      these on nearly every install; this rule is mainly interesting when the reader is
      a script inside node_modules rather than the package manager itself.
    sentinel.omarchy/fp-hint: "exe"
spec:
  options:
  - name: "policy-mode"
    value: "monitor"
  lsmhooks:
  - hook: "file_post_open"
    message: "Registry credential file opened for reading"
    args:
    - index: 0
      type: "file"
    - index: 1
      type: "int"
    selectors:
    - matchBinaries:
      - operator: "NotPostfix"
        values:
        - "/npm"
        - "/npx"
        - "/pnpm"
        - "/yarn"
        - "/bun"
        - "/node"
        - "/pip"
        - "/pip3"
        - "/uv"
        - "/poetry"
        - "/twine"
        - "/python"
        - "/python3"
        - "/cargo"
        - "/docker"
        - "/podman"
      matchArgs:
      - index: 0
        operator: "Equal"
        values:
        - "{{HOME}}/.npmrc"
        - "{{HOME}}/.pypirc"
        - "{{HOME}}/.cargo/credentials"
        - "{{HOME}}/.cargo/credentials.toml"
        - "{{HOME}}/.docker/config.json"
        - "{{HOME}}/.config/containers/auth.json"
      - index: 1
        operator: "Mask"
        values: ["4"]
      matchActions:
      - action: Post
        rateLimit: "300s"
        rateLimitScope: "process"
