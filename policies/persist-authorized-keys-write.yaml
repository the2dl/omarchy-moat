apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: sentinel-persist-authorized-keys-write
  annotations:
    sentinel.omarchy/severity: "critical"
    sentinel.omarchy/title: "SSH authorized_keys modified"
    sentinel.omarchy/enforce: "kill"
    sentinel.omarchy/actions: "kill,quarantine,ignore"
    sentinel.omarchy/why: >-
      Adding a public key to authorized_keys is a permanent remote backdoor that needs
      no malware left on disk and survives every password change.
    sentinel.omarchy/expected: >-
      ssh-copy-id, your editor, or a config-management run (ansible, chezmoi) that
      manages your keys.
    sentinel.omarchy/fp-hint: "exe"
spec:
  options:
  - name: "policy-mode"
    value: "monitor"
  lsmhooks:
  - hook: "file_post_open"
    message: "SSH authorized_keys opened for writing"
    args:
    - index: 0
      type: "file"
    - index: 1
      type: "int"
    selectors:
    - matchBinaries:
      - operator: "NotPostfix"
        values:
        - "/ssh-copy-id"
        - "/nvim"
        - "/vim"
        - "/nano"
        - "/emacs"
        - "/code"
        - "/zed"
        - "/hx"
      matchArgs:
      - index: 0
        operator: "Equal"
        values:
        - "{{HOME}}/.ssh/authorized_keys"
        - "{{HOME}}/.ssh/authorized_keys2"
        - "/root/.ssh/authorized_keys"
        - "/etc/ssh/authorized_keys"
      - index: 1
        operator: "Mask"
        values: ["2"]
      matchActions:
      - action: Sigkill
