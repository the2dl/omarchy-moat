apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: moat-persist-git-config-write
  annotations:
    moat.omarchy/severity: "high"
    moat.omarchy/title: "A repository's .git/config written by something other than git"
    moat.omarchy/enforce: "none"
    moat.omarchy/actions: "kill,quarantine,ignore"
    moat.omarchy/why: >-
      .git/config decides where `git push` sends your code and what git runs on your
      behalf: a rewritten remote URL ships the whole repository to somebody else the
      next time you push, and a `core.fsmonitor` or `core.pager` entry there is a
      command that runs on your next git command. The file is small, boring, and nobody
      reads it during review.
    moat.omarchy/expected: >-
      git itself, on clone, `git remote`, `git config`, and every fetch that updates a
      tracking branch. git, the git helpers, the TUIs and editors are all excluded, so
      what is left is a script rewriting your repository's settings.
    moat.omarchy/fp-hint: "exe+file"
spec:
  options:
  - name: "policy-mode"
    value: "monitor"
  kprobes:
  - call: "security_file_post_open"
    syscall: false
    message: "Repository .git/config opened for writing"
    args:
    - index: 0
      type: "file"
    - index: 1
      type: "int"
    selectors:
    - matchBinaries:
      - operator: "NotPostfix"
        values:
        - "/git"
        - "/git-remote-http"
        - "/git-remote-https"
        - "/git-lfs"
        - "/gh"
        - "/glab"
        - "/lazygit"
        - "/gitui"
        - "/tig"
        - "/jj"
        - "/cargo"
        - "/pre-commit"
        - "/chezmoi"
        - "/yadm"
        - "/nvim"
        - "/vim"
        - "/nano"
        - "/emacs"
        - "/code"
        - "/zed"
        - "/hx"
      matchArgs:
      - index: 0
        operator: "Postfix"
        values:
        - "/.git/config"
      - index: 1
        operator: "Mask"
        values: ["2"]
      matchActions:
      - action: Post
        rateLimit: "60s"
        rateLimitScope: "process"
