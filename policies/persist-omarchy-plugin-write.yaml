apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: moat-persist-omarchy-plugin-write
  annotations:
    moat.omarchy/severity: "medium"
    moat.omarchy/title: "Omarchy shell plugin code written by a non-editor"
    moat.omarchy/enforce: "none"
    moat.omarchy/actions: "quarantine,ignore"
    moat.omarchy/why: >-
      A plugin in ~/.config/omarchy/plugins is QML and JavaScript that runs inside
      omarchy-shell, in your session, and hot-reloads the moment it changes - no restart
      and no prompt.
    moat.omarchy/expected: >-
      Frequent. Plugins arrive and update through git, so `omarchy plugin add` and
      `omarchy plugin update` write hundreds of .git/ internals here (191 alerts on the
      first live run, 190 of them git); git and git-remote-http are allowlisted, and the
      omarchy-* helpers are suppressed in-kernel by the first selector.
    moat.omarchy/fp-hint: "exe"
spec:
  options:
  - name: "policy-mode"
    value: "monitor"
  kprobes:
  - call: "security_file_post_open"
    syscall: false
    message: "Omarchy shell plugin file opened for writing"
    args:
    - index: 0
      type: "file"
    - index: 1
      type: "int"
    selectors:
    - matchBinaries:
      - operator: "Prefix"
        values:
        - "/usr/bin/omarchy-"
        - "/usr/share/omarchy/"
      matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "{{HOME}}/.config/omarchy/plugins/"
      - index: 1
        operator: "Mask"
        values: ["2"]
      matchActions:
      - action: NoPost
    - matchBinaries:
      - operator: "NotPostfix"
        values:
        - "/nvim"
        - "/vim"
        - "/nano"
        - "/emacs"
        - "/code"
        - "/zed"
        - "/hx"
        - "/kate"
        - "/git"
        - "/git-remote-http"
      matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "{{HOME}}/.config/omarchy/plugins/"
      - index: 1
        operator: "Mask"
        values: ["2"]
      matchActions:
      - action: Post
        rateLimit: "60s"
        rateLimitScope: "process"
