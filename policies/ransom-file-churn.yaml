apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: moat-ransom-file-churn
  annotations:
    moat.omarchy/severity: "low"
    moat.omarchy/title: "A document was read, deleted, renamed or emptied"
    moat.omarchy/enforce: "none"
    moat.omarchy/actions: "ignore"
    moat.omarchy/why: >-
      One file being opened, deleted, renamed or emptied under your documents means
      nothing at all; it is what using a computer looks like. This policy exists to
      hand every one of those events to moatd, which counts them per program: a
      program that READS a file and then deletes, renames away or empties THAT SAME
      FILE, and does it to eight different files inside a minute, is encrypting them,
      and that count is the detection moat-ransom-file-churn. Builds delete files they
      never read and backups read files they never delete; only encryption does both
      to the same file.
    moat.omarchy/expected: >-
      Constantly, on its own, and that is fine: moatd owns this policy and never raises
      its individual events while the rule is on, so you should not see this line at
      all unless [rules] ransom_file_churn is off. It watches ~/Documents, ~/Desktop,
      ~/Pictures, ~/Videos, ~/Music and ~/Downloads and nothing else -- a whole-home
      version would sit in the band the telemetry file class measured under $HOME
      during an npm install (19-42 events per second, and that was writes alone), and
      is kept in policies/incubating/. Excluded in the kernel because they read-and-move or
      rename-on-save by design: mv, rsync, tar, git, cargo, the sync and backup
      clients, the terminal editors that rename the original to `file~`, and the
      thumbnailers and search tools that read every file in a folder.
    moat.omarchy/fp-hint: "exe"
    # BASELINE 4: a building block, not a detection. A single unlink or rename is
    # weak beyond use; the userland rule of the same name counts them into the
    # shape that matters. NO rateLimit anywhere below: rateLimit suppresses
    # events and never counts them (NOTES gap 5), and a counting rule fed by a
    # rate-limited policy sees one event per process per minute -- which is to
    # say nothing.
    moat.omarchy/tier: "signal"
spec:
  options:
  - name: "policy-mode"
    value: "monitor"
  kprobes:
  # THE READ HALF. Once per open, under the document directories only, and the
  # expensive half by a distance: this is the same hook the cred-* rules use,
  # scoped to directories a hijacked package has no build-time business in.
  # Measured on this desktop on 2026-09-06 with inotify over the same six
  # directories (164 files): zero opens, deletes or renames in 120 s at rest.
  # A kprobe rather than an LSM hook, because the file_post_open trampoline
  # holds 19 policies at most (NOTES section 3) and this must never be the one
  # that takes the sensor down.
  #
  # The exclusions are absolute paths (NotIn), not name suffixes: a payload can
  # call itself `rsync` in its own directory and a NotPostfix would believe it,
  # but only root writes /usr/bin. The cost of that choice is that a
  # version-managed or symlinked install (rustup's cargo, emacs-30.x) is not
  # excluded; cargo's churn is in target/, which moatd cuts anyway, and emacs
  # is named in the rule's `expected`.
  - call: "security_file_post_open"
    syscall: false
    message: "A document was opened for reading"
    args:
    - index: 0
      type: "file"
    - index: 1
      type: "int"
    selectors:
    - matchBinaries:
      - operator: "NotIn"
        values:
        # read-and-move / read-and-delete by design
        - "/usr/bin/mv"
        - "/usr/bin/rsync"
        - "/usr/bin/tar"
        - "/usr/bin/bsdtar"
        # toolchains: never the payload's own process, and never quiet
        - "/usr/bin/git"
        - "/usr/lib/git-core/git"
        - "/usr/bin/cargo"
        - "/usr/bin/rustc"
        - "/usr/bin/pacman"
        # read everything, destroy nothing: volume only
        - "/usr/bin/rg"
        - "/usr/bin/grep"
        - "/usr/bin/restic"
        - "/usr/bin/rustic"
        - "/usr/bin/kopia"
        - "/usr/bin/rclone"
        - "/usr/bin/syncthing"
        - "/usr/bin/nextcloud"
        - "/usr/bin/ffmpegthumbnailer"
        - "/usr/bin/gdk-pixbuf-thumbnailer"
        - "/usr/bin/totem-video-thumbnailer"
        - "/usr/bin/evince-thumbnailer"
        - "/usr/lib/tumbler-1/tumblerd"
        - "/usr/libexec/localsearch-3"
        - "/usr/lib/baloo_file"
        - "/usr/lib/baloo_file_extractor"
        # rename the original to `file~` on save, then delete the backup
        - "/usr/bin/nvim"
        - "/usr/bin/vim"
        - "/usr/bin/vi"
        - "/usr/bin/gvim"
      matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "{{HOME}}/Documents/"
        - "{{HOME}}/Desktop/"
        - "{{HOME}}/Pictures/"
        - "{{HOME}}/Videos/"
        - "{{HOME}}/Music/"
        - "{{HOME}}/Downloads/"
        # 2026-09-07: the document dirs were never where this machine keeps
        # what it would miss. A sweep confined to ~/Projects was invisible.
        # These three are added one step at a time, as the incubating note
        # asks -- NOT $HOME, whose cost is measured and refused there.
        - "{{HOME}}/Projects/"
        - "{{HOME}}/src/"
        - "{{HOME}}/code/"
      - index: 1
        operator: "Mask"
        # 6 = MAY_READ|MAY_WRITE. The mask filter is bitwise-ANY in the BPF
        # (`args & w`), so this matches an open for either.
        #
        # The WRITE half is what tells the rule a file is the actor's OWN.
        # 2026-09-07: `lake_sidecar_build` writes bucket-NNN.bin into a scratch
        # directory it invented, reads it back and deletes it -- read-then-
        # destroy exactly, and moat SIGKILLed it. Order separates a pipeline
        # from an encryptor: a pipeline writes a file before it reads it,
        # ransomware reads yours before it destroys it. See `Actor::wrote_first`.
        values: ["6"]
      matchActions:
      - action: Post
  # THE DESTROY HALF, three ways. Argument 0 is the parent directory (a
  # mount-aware path); argument 1 is the file itself as a bare dentry, which on
  # btrfs resolves only to its subvolume root (`/@home/dan/...`) -- moatd joins
  # the parent with the dentry's basename and never has to care. Only index 0 is
  # filtered (see rootkit-evidence-tamper). No trailing slash: the parent of
  # ~/Documents/x.pdf is ~/Documents itself.
  #
  # `rm` is NOT excluded, and neither are node, python or the shells: a loop of
  # `openssl enc … && rm` is the payload, and moatd folds the children of a
  # shell into one actor precisely so that shape is counted.
  - call: "security_path_unlink"
    syscall: false
    message: "A document was deleted"
    args:
    - index: 0
      type: "path"
    - index: 1
      type: "dentry"
    selectors:
    - matchBinaries:
      - operator: "NotIn"
        values:
        - "/usr/bin/rsync"
        - "/usr/bin/tar"
        - "/usr/bin/bsdtar"
        - "/usr/bin/git"
        - "/usr/lib/git-core/git"
        - "/usr/bin/cargo"
        - "/usr/bin/rustc"
        - "/usr/bin/pacman"
        - "/usr/bin/rclone"
        - "/usr/bin/syncthing"
        - "/usr/bin/nextcloud"
        - "/usr/bin/nvim"
        - "/usr/bin/vim"
        - "/usr/bin/vi"
        - "/usr/bin/gvim"
      matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "{{HOME}}/Documents"
        - "{{HOME}}/Desktop"
        - "{{HOME}}/Pictures"
        - "{{HOME}}/Videos"
        - "{{HOME}}/Music"
        - "{{HOME}}/Downloads"
        - "{{HOME}}/Projects"
        - "{{HOME}}/src"
        - "{{HOME}}/code"
      matchActions:
      - action: Post
  # security_path_rename(old_dir, old_dentry, new_dir, new_dentry, flags). The
  # new name is what the homogenisation shape is about (`report.pdf` ->
  # `report.pdf.locked`, across many files), so indexes 2 and 3 are carried for
  # moatd to read. VERIFIED in the v1.7.1 source that `path` and `dentry` at any
  # index up to 4 are copied and exported as path_arg (bpf/process/types/basic.h,
  # pkg/sensors/tracing/args_linux.go); NOT yet verified against a live event on
  # this machine, which is why moatd treats a missing new name as a plain rename
  # rather than dropping the event. `mv` stays included here: a same-filesystem
  # `mv x x.locked` is a rename and reads nothing.
  - call: "security_path_rename"
    syscall: false
    message: "A document was renamed"
    args:
    - index: 0
      type: "path"
    - index: 1
      type: "dentry"
    - index: 2
      type: "path"
    - index: 3
      type: "dentry"
    selectors:
    - matchBinaries:
      - operator: "NotIn"
        values:
        - "/usr/bin/rsync"
        - "/usr/bin/tar"
        - "/usr/bin/bsdtar"
        - "/usr/bin/git"
        - "/usr/lib/git-core/git"
        - "/usr/bin/cargo"
        - "/usr/bin/rustc"
        - "/usr/bin/pacman"
        - "/usr/bin/rclone"
        - "/usr/bin/syncthing"
        - "/usr/bin/nextcloud"
        - "/usr/bin/nvim"
        - "/usr/bin/vim"
        - "/usr/bin/vi"
        - "/usr/bin/gvim"
      matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "{{HOME}}/Documents"
        - "{{HOME}}/Desktop"
        - "{{HOME}}/Pictures"
        - "{{HOME}}/Videos"
        - "{{HOME}}/Music"
        - "{{HOME}}/Downloads"
        - "{{HOME}}/Projects"
        - "{{HOME}}/src"
        - "{{HOME}}/code"
      matchActions:
      - action: Post
  # Overwriting in place: read the plaintext, open the same file O_TRUNC, write
  # the ciphertext. fs/open.c only calls handle_truncate -> do_truncate ->
  # security_path_truncate for an O_TRUNC open of a file that ALREADY existed
  # (a file the open created has O_TRUNC cleared), so this is exactly "an
  # existing document was emptied" and never "a new file was written".
  # Argument 0 is the file itself, hence the trailing slashes.
  - call: "security_path_truncate"
    syscall: false
    message: "A document was emptied"
    args:
    - index: 0
      type: "path"
    selectors:
    - matchBinaries:
      - operator: "NotIn"
        values:
        - "/usr/bin/rsync"
        - "/usr/bin/tar"
        - "/usr/bin/bsdtar"
        - "/usr/bin/git"
        - "/usr/lib/git-core/git"
        - "/usr/bin/cargo"
        - "/usr/bin/rustc"
        - "/usr/bin/pacman"
        - "/usr/bin/rclone"
        - "/usr/bin/syncthing"
        - "/usr/bin/nextcloud"
        - "/usr/bin/nvim"
        - "/usr/bin/vim"
        - "/usr/bin/vi"
        - "/usr/bin/gvim"
      matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "{{HOME}}/Documents/"
        - "{{HOME}}/Desktop/"
        - "{{HOME}}/Pictures/"
        - "{{HOME}}/Videos/"
        - "{{HOME}}/Music/"
        - "{{HOME}}/Downloads/"
        # 2026-09-07: the document dirs were never where this machine keeps
        # what it would miss. A sweep confined to ~/Projects was invisible.
        # These three are added one step at a time, as the incubating note
        # asks -- NOT $HOME, whose cost is measured and refused there.
        - "{{HOME}}/Projects/"
        - "{{HOME}}/src/"
        - "{{HOME}}/code/"
      matchActions:
      - action: Post
