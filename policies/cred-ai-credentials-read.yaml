apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: moat-cred-ai-credentials-read
  annotations:
    moat.omarchy/severity: "high"
    moat.omarchy/title: "AI CLI credential file read by an unexpected program"
    moat.omarchy/rotate: "anthropic-token,openai-token,google-token"
    moat.omarchy/enforce: "none"
    moat.omarchy/actions: "kill,quarantine,ignore"
    moat.omarchy/why: >-
      The OAuth tokens and API keys the AI CLIs cache buy an attacker your model quota
      and, worse, any repository or tool the agent is configured to reach; they are
      plain JSON at a fixed path.
    moat.omarchy/expected: >-
      claude, codex, gemini, opencode, q and amp themselves, and any node or bun process
      that is actually one of those CLIs. Omarchy's own usage widgets
      (/usr/share/omarchy/bin/omarchy-agent-usage-*) read the Claude credential file on
      every refresh and are suppressed in-kernel by the first selector.
    moat.omarchy/fp-hint: "exe"
spec:
  options:
  - name: "policy-mode"
    value: "monitor"
  lsmhooks:
  - hook: "file_post_open"
    message: "AI CLI credential file opened for reading"
    args:
    - index: 0
      type: "file"
    - index: 1
      type: "int"
    selectors:
    # Selector 0 first, ending in NoPost: Omarchy's own usage widgets read
    # ~/.claude/.credentials.json every refresh. Selectors are ORed and the first
    # match wins (notes section 2 / 10), so this suppresses them in-kernel.
    - matchBinaries:
      - operator: "Prefix"
        values:
        - "/usr/share/omarchy/bin/omarchy-agent-usage-"
      matchArgs:
      # Postfix, not Equal against {{HOME}}: a credential file read from a
      # non-canonical path (a copy, a backup, a bind mount, a bundled decoy)
      # is the same signal as one read from home. See cred-cloud-credentials-read
      # for the 2026-09-06 exfil test that made this concrete. Monitor-only, so
      # this only widens a low chain step; the tool exclusions still apply.
      - index: 0
        operator: "Postfix"
        values:
        - "/.claude/.credentials.json"
        - "/.claude.json"
        - "/.codex/auth.json"
        - "/.config/openai/auth.json"
        - "/.gemini/oauth_creds.json"
        - "/.config/opencode/auth.json"
        - "/.local/share/amazon-q/credentials.json"
      - index: 1
        operator: "Mask"
        values: ["4"]
      matchActions:
      - action: NoPost
    - matchBinaries:
      - operator: "NotPostfix"
        values:
        - "/node"
        - "/bun"
        - "/claude"
        - "/codex"
        - "/gemini"
        - "/opencode"
        - "/amp"
        - "/q"
        - "/qterm"
      matchArgs:
      - index: 0
        operator: "Postfix"
        values:
        - "/.claude/.credentials.json"
        - "/.claude.json"
        - "/.codex/auth.json"
        - "/.config/openai/auth.json"
        - "/.gemini/oauth_creds.json"
        - "/.config/opencode/auth.json"
        - "/.local/share/amazon-q/credentials.json"
      - index: 1
        operator: "Mask"
        values: ["4"]
      matchActions:
      - action: Post
        rateLimit: "60s"
        rateLimitScope: "process"
