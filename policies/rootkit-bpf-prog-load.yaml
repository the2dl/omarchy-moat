apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: moat-rootkit-bpf-prog-load
  annotations:
    moat.omarchy/severity: "high"
    moat.omarchy/title: "eBPF program loaded by an unexpected binary"
    moat.omarchy/enforce: "none"
    moat.omarchy/actions: "kill,ignore"
    moat.omarchy/why: >-
      Modern Linux rootkits are eBPF programs: they hide processes and files and tamper
      with the very telemetry that would show them. On a desktop the only things that
      load BPF are systemd, container runtimes and this sensor.
    moat.omarchy/expected: >-
      Docker, containerd, podman and Cilium load BPF on every container start; systemd
      loads it for cgroup and socket filters. bpftrace, bcc tools and perf if you use
      them.
    moat.omarchy/fp-hint: "exe"
spec:
  options:
  - name: "policy-mode"
    value: "monitor"
  lsmhooks:
  - hook: "bpf"
    message: "BPF_PROG_LOAD from an unexpected binary"
    args:
    - index: 0
      type: "int"
    selectors:
    - matchBinaries:
      - operator: "NotIn"
        values:
        - "/usr/bin/tetragon"
        - "/usr/lib/tetragon/bpftool"
        - "/usr/bin/bpftool"
        - "/usr/lib/systemd/systemd"
        - "/usr/lib/systemd/systemd-networkd"
        - "/usr/lib/systemd/systemd-resolved"
        - "/usr/lib/systemd/systemd-udevd"
        - "/usr/bin/dockerd"
        - "/usr/bin/containerd"
        - "/usr/bin/runc"
        # A CONTAINER's runc, whose path is its own, not this machine's.
        #
        # 2026-09-08, overnight: 299 of 302 alerts on this rule came from
        # `/usr/local/sbin/runc`, which does not exist on the host -- it is the
        # runc inside a Kubernetes node container, and `matchBinaries` compares
        # the path as that namespace sees it. The exclusion for `/usr/bin/runc`
        # right above could never match it.
        #
        # These are the layouts seen in practice rather than a guess. Matching
        # `NotPostfix "/runc"` would cover every layout at once and is
        # deliberately NOT done: this rule is the one that catches an eBPF
        # rootkit, and "anything called runc, anywhere" is too cheap a name to
        # buy silence with.
        - "/usr/local/sbin/runc"
        - "/usr/local/bin/runc"
        - "/usr/sbin/runc"
        - "/usr/bin/crun"
        - "/usr/bin/podman"
        - "/usr/bin/cilium-agent"
        # Calico is the other CNI that loads BPF per node, same as Cilium.
        - "/usr/bin/calico-node"
        - "/opt/cni/bin/calico"
        - "/usr/bin/ip"
        - "/usr/bin/tc"
      matchArgs:
      - index: 0
        operator: "Equal"
        values: ["5"]
      matchActions:
      - action: Post
        rateLimit: "60s"
        rateLimitScope: "process"
