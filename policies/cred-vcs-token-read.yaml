apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: moat-cred-vcs-token-read
  annotations:
    moat.omarchy/severity: "high"
    moat.omarchy/title: "Git forge token or .netrc read by an unexpected program"
    moat.omarchy/rotate: "github-token,git-credentials"
    moat.omarchy/enforce: "none"
    moat.omarchy/actions: "kill,quarantine,ignore"
    moat.omarchy/why: >-
      A GitHub token in gh's hosts.yml, ~/.git-credentials or ~/.netrc lets an attacker
      push to every repository you can push to; supply-chain worms use exactly this to
      spread from one developer to their organisation.
    moat.omarchy/expected: >-
      git and its credential helpers, gh, glab, curl invocations you started yourself
      that use .netrc, and IDE git plugins.
    moat.omarchy/fp-hint: "exe"
spec:
  options:
  - name: "policy-mode"
    value: "monitor"
  lsmhooks:
  - hook: "file_post_open"
    message: "Git forge credential file opened for reading"
    args:
    - index: 0
      type: "file"
    - index: 1
      type: "int"
    selectors:
    - matchBinaries:
      - operator: "NotPostfix"
        values:
        - "/git"
        - "/git-remote-http"
        - "/git-remote-https"
        - "/git-credential-store"
        - "/git-credential-libsecret"
        - "/git-credential-netrc"
        - "/gh"
        - "/glab"
        - "/tea"
        - "/hub"
        - "/lazygit"
        - "/mise"
      matchArgs:
      # Postfix, not Equal against {{HOME}}: a credential file read from a
      # non-canonical path (a copy, a backup, a bind mount, a bundled decoy)
      # is the same signal as one read from home. See cred-cloud-credentials-read
      # for the 2026-09-06 exfil test that made this concrete. Monitor-only, so
      # this only widens a low chain step; the tool exclusions still apply.
      - index: 0
        operator: "Postfix"
        values:
        - "/.git-credentials"
        - "/.netrc"
        - "/.config/gh/hosts.yml"
        - "/.config/glab-cli/config.yml"
        - "/.config/git/credentials"
      - index: 1
        operator: "Mask"
        values: ["4"]
      matchActions:
      - action: Post
        rateLimit: "60s"
        rateLimitScope: "process"
