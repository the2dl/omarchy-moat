apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: moat-canary-file-read
  annotations:
    moat.omarchy/severity: "critical"
    moat.omarchy/title: "A decoy file was read"
    moat.omarchy/enforce: "deny"
    moat.omarchy/actions: "kill,quarantine,ignore"
    moat.omarchy/namespace: "global"
    moat.omarchy/why: >-
      These files are decoys. Moat wrote them, nothing else knows their names, no config
      references them, and they hold nothing real. Nothing on this machine has a reason to
      open one, so a program that just did was reading files it was not asked to read --
      which is what credential theft looks like from the outside.
    moat.omarchy/expected: >-
      Nothing. This is the one rule here with no legitimate reader: any program on the
      exclusion list below is there because it reads EVERY file, not because it has business
      with this one. A backup or a full-disk search will trip it, and that is the only
      false positive this rule has.
    moat.omarchy/fp-hint: "exe"
spec:
  options:
  - name: "policy-mode"
    value: "monitor"
  lsmhooks:
  - hook: "file_post_open"
    message: "A decoy file was opened for reading"
    args:
    - index: 0
      type: "file"
    - index: 1
      type: "int"
    selectors:
    # One selector, one list of exact paths. `file` arguments take map-backed
    # Equal with no four-value cap (NOTES section 2), so every decoy on the
    # machine costs one policy between them rather than one each -- which
    # matters, because LSM file_post_open has 19 slots and 10 are spoken for.
    - matchBinaries:
      # Deliberately short, and every entry reads the whole disk for a living.
      #
      # The other file rules subtract programs that have business with the file
      # they watch -- ssh with ssh keys, git with credentials. Nothing has
      # business with these, so there is nothing to subtract: what is left is
      # only the tools that would read any file at all, and a nightly backup
      # raising a critical alert is a rule nobody keeps switched on.
      #
      # `moatd` itself is here because it verifies these files still exist.
      - operator: "NotPostfix"
        values:
        - "/restic"
        - "/borg"
        - "/borgmatic"
        - "/rsync"
        - "/duplicity"
        - "/rclone"
        - "/timeshift"
        - "/deja-dup"
        - "/tar"
        - "/clamscan"
        - "/clamd"
        - "/freshclam"
        - "/moatd"
        - "/moatctl"
      matchArgs:
      - index: 0
        operator: "Equal"
        values:
        - "{{CANARIES}}"
      # 4 is FMODE_READ. A decoy that is written rather than read is somebody
      # tidying up, not somebody stealing, and it is not worth a critical.
      - index: 1
        operator: "Mask"
        values: ["4"]
      matchActions:
      # Deny the read (-EACCES), do not kill the reader -- the same choice
      # cred-ssh-private-key-read documents at length. `security_file_post_open`
      # is called from `do_open()`, so a non-zero return fails the open and no
      # descriptor is installed: the decoy's contents never reach the caller.
      #
      # It matters more here than there. A canary read is close to certain
      # malice, which is an argument for Sigkill -- but the one false positive
      # this rule has is a backup, and killing restic halfway through a run is a
      # worse outcome than restic skipping one file and saying so. Denying costs
      # the attacker the bytes either way and leaves the process alive to be
      # looked at, which is the whole point of having caught it.
      #
      # This only applies once the rule is armed. Until then the policy is in
      # monitor and the read succeeds -- see `moatctl canary --enforce on`.
      - action: Override
        argError: -13
