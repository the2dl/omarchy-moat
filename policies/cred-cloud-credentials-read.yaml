apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: sentinel-cred-cloud-credentials-read
  annotations:
    sentinel.omarchy/severity: "high"
    sentinel.omarchy/title: "Cloud or cluster credentials read by an unexpected program"
    sentinel.omarchy/rotate: "aws-key,gcp-token,azure-token,kubeconfig"
    sentinel.omarchy/enforce: "none"
    sentinel.omarchy/actions: "kill,quarantine,ignore"
    sentinel.omarchy/why: >-
      A long-lived AWS access key or a kubeconfig is worth more than the laptop it sits
      on; stealer payloads in build dependencies read these files first because they are
      always at the same path.
    sentinel.omarchy/expected: >-
      aws, gcloud, az, kubectl, helm, k9s, terraform, docker/podman with a cloud
      registry, and IDE cloud plugins.
    sentinel.omarchy/fp-hint: "exe"
spec:
  options:
  - name: "policy-mode"
    value: "monitor"
  lsmhooks:
  - hook: "file_post_open"
    message: "Cloud or cluster credential file opened for reading"
    args:
    - index: 0
      type: "file"
    - index: 1
      type: "int"
    selectors:
    - matchBinaries:
      - operator: "NotPostfix"
        values:
        - "/aws"
        - "/aws_completer"
        - "/gcloud"
        - "/az"
        - "/kubectl"
        - "/helm"
        - "/k9s"
        - "/kubectx"
        - "/kubens"
        - "/terraform"
        - "/tofu"
        - "/pulumi"
        - "/docker"
        - "/podman"
        - "/skaffold"
        - "/flux"
      matchArgs:
      - index: 0
        operator: "Equal"
        values:
        - "{{HOME}}/.aws/credentials"
        - "{{HOME}}/.aws/config"
        - "{{HOME}}/.aws/sso/cache"
        - "{{HOME}}/.config/gcloud/credentials.db"
        - "{{HOME}}/.config/gcloud/access_tokens.db"
        - "{{HOME}}/.config/gcloud/application_default_credentials.json"
        - "{{HOME}}/.azure/msal_token_cache.json"
        - "{{HOME}}/.azure/accessTokens.json"
        - "{{HOME}}/.kube/config"
      - index: 1
        operator: "Mask"
        values: ["4"]
      matchActions:
      - action: Post
        rateLimit: "60s"
        rateLimitScope: "process"
