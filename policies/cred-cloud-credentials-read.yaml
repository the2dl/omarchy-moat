apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: moat-cred-cloud-credentials-read
  annotations:
    moat.omarchy/severity: "high"
    moat.omarchy/title: "Cloud or cluster credentials read by an unexpected program"
    moat.omarchy/rotate: "aws-key,gcp-token,azure-token,kubeconfig"
    moat.omarchy/enforce: "none"
    moat.omarchy/actions: "kill,quarantine,ignore"
    moat.omarchy/why: >-
      A long-lived AWS access key or a kubeconfig is worth more than the laptop it sits
      on; stealer payloads in build dependencies read these files first because they are
      always at the same path.
    moat.omarchy/expected: >-
      The devops toolchain, all allowlisted: aws, gcloud, az, kubectl, helm, k9s,
      terraform, tofu, pulumi, ansible, sam, minikube, kind, flyctl, wrangler, vercel,
      netlify, doctl, and docker/podman against a cloud registry. Node- and
      python-based SDK scripts are deliberately NOT allowlisted (a stealer is a node or
      python script), so boto3 in your own script, an IDE cloud plugin or a
      direnv/aws-vault wrapper will fire.
    moat.omarchy/fp-hint: "exe"
spec:
  options:
  - name: "policy-mode"
    value: "monitor"
  lsmhooks:
  - hook: "file_post_open"
    message: "Cloud or cluster credential file opened for reading"
    args:
    - index: 0
      type: "file"
    - index: 1
      type: "int"
    selectors:
    - matchBinaries:
      - operator: "NotPostfix"
        values:
        - "/aws"
        - "/aws_completer"
        - "/gcloud"
        - "/az"
        - "/kubectl"
        - "/helm"
        - "/k9s"
        - "/kubectx"
        - "/kubens"
        - "/terraform"
        - "/tofu"
        - "/pulumi"
        - "/docker"
        - "/podman"
        - "/skaffold"
        - "/flux"
        # devops tools that read these files by design (coordinator review):
        - "/ansible"
        - "/ansible-playbook"
        - "/sam"
        - "/minikube"
        - "/kind"
        - "/flyctl"
        - "/wrangler"
        - "/vercel"
        - "/netlify"
        - "/doctl"
      matchArgs:
      - index: 0
        operator: "Equal"
        values:
        - "{{HOME}}/.aws/credentials"
        - "{{HOME}}/.aws/config"
        - "{{HOME}}/.aws/sso/cache"
        - "{{HOME}}/.config/gcloud/credentials.db"
        - "{{HOME}}/.config/gcloud/access_tokens.db"
        - "{{HOME}}/.config/gcloud/application_default_credentials.json"
        - "{{HOME}}/.azure/msal_token_cache.json"
        - "{{HOME}}/.azure/accessTokens.json"
        - "{{HOME}}/.kube/config"
      - index: 1
        operator: "Mask"
        values: ["4"]
      matchActions:
      - action: Post
        rateLimit: "60s"
        rateLimitScope: "process"
