apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: moat-cred-etc-shadow-read
  annotations:
    moat.omarchy/severity: "critical"
    moat.omarchy/title: "/etc/shadow read by a program that is not an authentication tool"
    moat.omarchy/rotate: "local-password"
    moat.omarchy/enforce: "deny"
    moat.omarchy/actions: "kill,ignore"
    moat.omarchy/why: >-
      Only PAM helpers and the shadow-utils suite have any reason to read the local
      password hashes; anything else reading them is either already root and dumping
      them for offline cracking, or a misconfigured file mode you want to know about.
    moat.omarchy/expected: >-
      The user database service reads it constantly: systemd-userdbd and the
      systemd-userwork workers it forks opened /etc/shadow seven times in fifteen
      seconds on a normal login, and sddm-helper reads it on every unlock. Beyond those,
      a screen locker, display manager or PAM module not in the allowlist, or a backup
      of /etc run as root.
    moat.omarchy/fp-hint: "exe"
spec:
  options:
  - name: "policy-mode"
    value: "monitor"
  lsmhooks:
  - hook: "file_post_open"
    message: "Local password hash database opened for reading"
    args:
    - index: 0
      type: "file"
    - index: 1
      type: "int"
    selectors:
    - matchBinaries:
      - operator: "NotIn"
        values:
        - "/usr/bin/passwd"
        - "/usr/bin/su"
        - "/usr/bin/sudo"
        - "/usr/bin/unix_chkpwd"
        - "/usr/bin/login"
        - "/usr/bin/sshd"
        - "/usr/bin/chage"
        - "/usr/bin/gpasswd"
        - "/usr/bin/newgrp"
        - "/usr/bin/chpasswd"
        - "/usr/bin/useradd"
        - "/usr/bin/userdel"
        - "/usr/bin/usermod"
        - "/usr/bin/groupadd"
        - "/usr/bin/groupdel"
        - "/usr/bin/groupmod"
        - "/usr/bin/vipw"
        - "/usr/bin/pwck"
        - "/usr/bin/grpck"
        - "/usr/bin/systemd-sysusers"
        - "/usr/lib/systemd/systemd"
        - "/usr/lib/systemd/systemd-homed"
        - "/usr/lib/systemd/systemd-userdbd"
        - "/usr/lib/systemd/systemd-userwork"
        - "/usr/lib/sddm/sddm-helper"
        - "/usr/lib/polkit-1/polkit-agent-helper-1"
        - "/usr/bin/hyprlock"
        - "/usr/bin/swaylock"
        - "/usr/bin/gdm"
        - "/usr/bin/sddm"
        - "/usr/bin/greetd"
        - "/usr/bin/pacman"
      matchArgs:
      - index: 0
        operator: "Equal"
        values:
        - "/etc/shadow"
        - "/etc/shadow-"
        - "/etc/gshadow"
      - index: 1
        operator: "Mask"
        values: ["4"]
      matchActions:
      # Deny the READ, do not kill the reader.
      #
      # -13 is -EACCES: `security_file_post_open` is called from `do_open()`,
      # so a non-zero return fails the open() and no file descriptor is ever
      # installed. The bytes are not read. That is the same prevention Sigkill
      # gave, without the collateral: on 2026-09-05 this policy was armed with
      # Sigkill and would have killed `grep -r ~`, restic and borg outright --
      # none of them are in the exclusion list below, and a backup dying
      # halfway through is a worse outcome than a backup that skips one file
      # and says so.
      #
      # It also leaves the process alive to be looked at, which is this
      # project's stated preference everywhere else: a refused action you can
      # investigate beats a dead process you cannot.
      - action: Override
        argError: -13
