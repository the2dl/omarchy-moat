apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: moat-cred-ssh-recon-read
  annotations:
    moat.omarchy/severity: "medium"
    moat.omarchy/title: "~/.ssh/config or known_hosts read by an unexpected program"
    moat.omarchy/enforce: "none"
    moat.omarchy/actions: "quarantine,ignore"
    moat.omarchy/why: >-
      These two files are the map: every host you log into, the user name you use there,
      the jump hosts, the aliases. Nothing in them is secret on its own, which is why
      they are read first - they tell an attacker where the key it just took is worth
      using, and worms have spread host to host on exactly this list.
    moat.omarchy/expected: >-
      ssh, scp, sftp, rsync, mosh, git over ssh, ssh-keygen -R and your shell's host-name
      completion, which reads known_hosts on tab. All excluded, and almost nothing else
      opens these files.
    moat.omarchy/fp-hint: "exe"
spec:
  options:
  - name: "policy-mode"
    value: "monitor"
  kprobes:
  - call: "security_file_post_open"
    syscall: false
    message: "SSH host list or client config opened for reading"
    args:
    - index: 0
      type: "file"
    - index: 1
      type: "int"
    selectors:
    - matchBinaries:
      - operator: "NotPostfix"
        values:
        - "/ssh"
        - "/sshd"
        - "/scp"
        - "/sftp"
        - "/ssh-add"
        - "/ssh-agent"
        - "/ssh-keygen"
        - "/ssh-keyscan"
        - "/ssh-copy-id"
        - "/autossh"
        - "/mosh"
        - "/rsync"
        - "/git"
        - "/git-remote-http"
        - "/git-remote-https"
        - "/gh"
        - "/ansible"
        - "/ansible-playbook"
        - "/kitten"
        - "/distrobox"
        - "/vagrant"
        - "/code"
        - "/zed"
        - "/nvim"
        - "/bash"
        - "/zsh"
        - "/fish"
      matchArgs:
      - index: 0
        operator: "Equal"
        values:
        - "{{HOME}}/.ssh/config"
        - "{{HOME}}/.ssh/known_hosts"
        - "{{HOME}}/.ssh/known_hosts2"
        - "{{HOME}}/.ssh/authorized_keys"
      - index: 1
        operator: "Mask"
        values: ["4"]
      matchActions:
      - action: Post
        rateLimit: "300s"
        rateLimitScope: "process"
