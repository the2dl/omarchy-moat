apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: sentinel-pkg-subtree-downloader
  annotations:
    sentinel.omarchy/severity: "high"
    sentinel.omarchy/title: "Package install ran a downloader or decoder"
    sentinel.omarchy/enforce: "none"
    sentinel.omarchy/actions: "kill,ignore"
    sentinel.omarchy/why: >-
      A postinstall script that reaches for curl, wget or base64 is fetching or unpacking
      something the lockfile never pinned; this is the shape of every recent npm and AUR
      compromise.
    sentinel.omarchy/expected: >-
      Prebuilt-binary downloaders (node-pre-gyp, sharp, esbuild, playwright, puppeteer),
      cargo build scripts that fetch toolchains, and PKGBUILDs that curl a release
      tarball.
    sentinel.omarchy/fp-hint: "parent"
spec:
  options:
  - name: "policy-mode"
    value: "monitor"
  lsmhooks:
  - hook: "bprm_check_security"
    message: "Downloader or decoder executed inside a package manager process tree"
    args:
    - index: 0
      type: "linux_binprm"
    selectors:
    - matchParentBinaries:
      - operator: "In"
        followChildren: true
        values:
        - "/usr/bin/npm"
        - "/usr/bin/npx"
        - "/usr/bin/pnpm"
        - "/usr/bin/yarn"
        - "/usr/bin/bun"
        - "/usr/bin/node"
        - "/usr/local/bin/node"
        - "/usr/bin/pip"
        - "/usr/bin/pip3"
        - "/usr/bin/uv"
        - "/usr/bin/cargo"
        - "/usr/bin/makepkg"
      matchArgs:
      - index: 0
        operator: "Postfix"
        values:
        - "/curl"
        - "/wget"
        - "/aria2c"
        - "/base64"
        - "/openssl"
        - "/xxd"
        - "/xh"
        - "/httpie"
      matchActions:
      - action: Post
        rateLimit: "60s"
        rateLimitScope: "process"
