apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: moat-persist-hypr-config-write
  annotations:
    moat.omarchy/severity: "medium"
    moat.omarchy/title: "Hyprland configuration modified by a non-editor"
    moat.omarchy/enforce: "none"
    moat.omarchy/actions: "quarantine,ignore"
    moat.omarchy/why: >-
      Every exec-once line in ~/.config/hypr runs at every login with your full desktop
      session - no unit file, no autostart entry, nothing root-owned. It is persistence
      that hides among the files you edit yourself.
    moat.omarchy/expected: >-
      Your editor, hyprctl keyword writes, omarchy-shell saving its own settings, the
      omarchy-* helper scripts (suppressed in-kernel by the first selector) and pacman
      installing a default config.
    moat.omarchy/fp-hint: "exe"
spec:
  options:
  - name: "policy-mode"
    value: "monitor"
  kprobes:
  - call: "security_file_post_open"
    syscall: false
    message: "Hyprland configuration opened for writing"
    args:
    - index: 0
      type: "file"
    - index: 1
      type: "int"
    selectors:
    # Selector 0 ends in NoPost: selectors are ORed, first match wins, so the
    # omarchy helpers never reach the alerting selector (notes section 2 / 10).
    - matchBinaries:
      - operator: "Prefix"
        values:
        - "/usr/bin/omarchy-"
        - "/usr/share/omarchy/"
      matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "{{HOME}}/.config/hypr/"
      - index: 1
        operator: "Mask"
        values: ["2"]
      matchActions:
      - action: NoPost
    - matchBinaries:
      - operator: "NotPostfix"
        values:
        - "/nvim"
        - "/vim"
        - "/nano"
        - "/emacs"
        - "/code"
        - "/zed"
        - "/hx"
        - "/kate"
        - "/quickshell"
        - "/omarchy-shell"
        - "/hyprctl"
        - "/pacman"
      matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "{{HOME}}/.config/hypr/"
      - index: 1
        operator: "Mask"
        values: ["2"]
      matchActions:
      - action: Post
        rateLimit: "60s"
        rateLimitScope: "process"
