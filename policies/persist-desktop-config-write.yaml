apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: sentinel-persist-desktop-config-write
  annotations:
    sentinel.omarchy/severity: "medium"
    sentinel.omarchy/title: "Hyprland or Omarchy configuration modified by a non-editor"
    sentinel.omarchy/enforce: "none"
    sentinel.omarchy/actions: "quarantine,ignore"
    sentinel.omarchy/why: >-
      Hyprland exec-once lines and Omarchy autostart config run at session start with
      your full desktop session; editing them is persistence that hides in plain sight
      among files you edit yourself.
    sentinel.omarchy/expected: >-
      Your editor, the omarchy-* helper scripts (allowlisted here), omarchy-shell saving
      its own settings, and theme switches.
    sentinel.omarchy/fp-hint: "exe"
spec:
  options:
  - name: "policy-mode"
    value: "monitor"
  lsmhooks:
  - hook: "file_post_open"
    message: "Hyprland or Omarchy configuration opened for writing"
    args:
    - index: 0
      type: "file"
    - index: 1
      type: "int"
    selectors:
    - matchBinaries:
      - operator: "Prefix"
        values:
        - "/usr/bin/omarchy-"
        - "/usr/share/omarchy/"
      matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "{{HOME}}/.config/hypr/"
        - "{{HOME}}/.config/omarchy/"
      - index: 1
        operator: "Mask"
        values: ["2"]
      matchActions:
      - action: NoPost
    - matchBinaries:
      - operator: "NotPostfix"
        values:
        - "/nvim"
        - "/vim"
        - "/nano"
        - "/emacs"
        - "/code"
        - "/zed"
        - "/hx"
        - "/kate"
        - "/quickshell"
        - "/omarchy-shell"
        - "/hyprctl"
        - "/pacman"
      matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "{{HOME}}/.config/hypr/"
        - "{{HOME}}/.config/omarchy/"
      - index: 1
        operator: "Mask"
        values: ["2"]
      matchActions:
      - action: Post
        rateLimit: "60s"
        rateLimitScope: "process"
