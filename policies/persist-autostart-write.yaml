apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: moat-persist-autostart-write
  annotations:
    moat.omarchy/severity: "high"
    moat.omarchy/title: "Desktop autostart or user systemd unit written"
    moat.omarchy/enforce: "none"
    moat.omarchy/actions: "kill,quarantine,ignore"
    moat.omarchy/why: >-
      A .desktop file in ~/.config/autostart or a user unit in ~/.config/systemd/user
      restarts a payload at every login without touching anything root-owned.
    moat.omarchy/expected: >-
      Installing a user service on purpose (syncthing, mise, Docker Desktop) and
      GNOME/KDE settings dialogs. Plain application launchers in
      ~/.local/share/applications are a separate, quieter rule
      (moat-persist-desktop-entry-write) - this one is only the two paths that start
      something at every login.
    moat.omarchy/fp-hint: "exe"
spec:
  options:
  - name: "policy-mode"
    value: "monitor"
  lsmhooks:
  - hook: "file_post_open"
    message: "Autostart entry or user systemd unit opened for writing"
    args:
    - index: 0
      type: "file"
    - index: 1
      type: "int"
    selectors:
    - matchBinaries:
      - operator: "NotPostfix"
        values:
        - "/nvim"
        - "/vim"
        - "/nano"
        - "/emacs"
        - "/code"
        - "/zed"
        - "/hx"
        - "/kate"
        - "/systemctl"
        - "/systemd"
        - "/systemd-run"
        - "/pacman"
        - "/flatpak"
        - "/gnome-tweaks"
      matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "{{HOME}}/.config/autostart/"
        - "{{HOME}}/.config/systemd/user/"
      - index: 1
        operator: "Mask"
        values: ["2"]
      matchActions:
      - action: Post
        rateLimit: "60s"
        rateLimitScope: "process"
