apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: moat-persist-system-unit-write
  annotations:
    moat.omarchy/severity: "high"
    moat.omarchy/title: "System unit, sudoers or cron entry written"
    moat.omarchy/enforce: "none"
    moat.omarchy/actions: "kill,quarantine,ignore"
    moat.omarchy/why: >-
      These four trees are how a payload that got root once keeps root: a unit that
      restarts it, a sudoers drop-in that gives a user passwordless root, or a cron job
      that reinstalls it after you clean up.
    moat.omarchy/expected: >-
      pacman installing or upgrading a package, systemd writing its own state, and you
      editing a unit or a sudoers drop-in with sudo and an editor.
    moat.omarchy/fp-hint: "exe"
spec:
  options:
  - name: "policy-mode"
    value: "monitor"
  kprobes:
  - call: "security_file_post_open"
    syscall: false
    message: "System unit, sudoers or cron file opened for writing"
    args:
    - index: 0
      type: "file"
    - index: 1
      type: "int"
    selectors:
    # The HOST's copy of this path, not every container's.
    #
    # A path is namespace-relative and this policy matches the STRING, so a
    # container writing its OWN copy -- a different file, on a different
    # filesystem, meaning nothing to this machine -- matched. Found three times
    # on 2026-09-07 (pg_isready reading a container's /etc/shadow, dpkg
    # installing a container's ca-certificates, runc's seccomp) before this was
    # swept. `host_ns` is resolved by tetragon at load; no inode is pinned.
    - matchNamespaces:
      - namespace: Mnt
        operator: "In"
        values:
        - "host_ns"
      matchBinaries:
      - operator: "NotPostfix"
        values:
        - "/pacman"
        - "/systemd"
        - "/systemctl"
        - "/systemd-sysusers"
        - "/systemd-tmpfiles"
        - "/visudo"
        - "/sudoedit"
        - "/crontab"
        - "/bsdtar"
        - "/tar"
        - "/install"
        - "/nvim"
        - "/vim"
        - "/nano"
        - "/emacs"
        - "/code"
        - "/zed"
      matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "/etc/systemd/system/"
        - "/etc/sudoers"
        - "/etc/cron"
        - "/var/spool/cron/"
      - index: 1
        operator: "Mask"
        values: ["2"]
      matchActions:
      - action: Post
        rateLimit: "60s"
        rateLimitScope: "process"
