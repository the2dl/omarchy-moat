apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: moat-priv-proc-mem-access
  annotations:
    moat.omarchy/severity: "medium"
    moat.omarchy/title: "Another process's memory, environment or auxv opened through /proc"
    moat.omarchy/enforce: "none"
    moat.omarchy/actions: "kill,ignore"
    moat.omarchy/why: >-
      Opening /proc/<pid>/mem, /proc/<pid>/environ or /proc/<pid>/auxv hands the reader
      the plaintext of another process - session cookies, decrypted vault entries,
      ssh-agent keys, and the tokens passed to it in its environment. This is the
      fileless half of credential theft, and nothing on a desktop does it routinely
      except a debugger.
    moat.omarchy/expected: >-
      Debuggers and crash handling: gdb, lldb, strace, perf and systemd-coredump, which
      are allowlisted. A profiler or crash reporter not in that list will fire.
    moat.omarchy/fp-hint: "exe"
spec:
  options:
  - name: "policy-mode"
    value: "monitor"
  kprobes:
  # proc_mem_open() is the shared open path for /proc/<pid>/{mem,environ,auxv}
  # (fs/proc/base.c: mem_open, environ_open and auxv_open all call it). It is a
  # global symbol on this kernel (`T proc_mem_open` in /proc/kallsyms), unlike the
  # static mem_open/environ_open/auxv_open. Prototype from vmlinux BTF:
  #   struct mm_struct *proc_mem_open(struct inode *inode, unsigned int mode)
  # arg 1 is the PTRACE_MODE_* the caller asked for (1 = READ, 2 = ATTACH); it is
  # captured for evidence but not filtered on, because every call here is already
  # "someone is opening another process's memory image".
  #
  # This replaces the earlier LSM ptrace_access_check + Mask 1 shape, which fired on
  # every /proc/<pid>/stat and cmdline read (pkill alone: 612 events; plus pipewire,
  # journald, Hyprland and chrome) and was pure noise.
  - call: "proc_mem_open"
    syscall: false
    message: "Another process's memory, environment or auxv opened through /proc"
    args:
    - index: 1
      type: "uint32"
    selectors:
    - matchBinaries:
      - operator: "NotIn"
        values:
        - "/usr/bin/gdb"
        - "/usr/bin/lldb"
        - "/usr/bin/strace"
        - "/usr/bin/perf"
        - "/usr/lib/systemd/systemd-coredump"
      matchActions:
      - action: Post
        rateLimit: "60s"
        rateLimitScope: "process"
