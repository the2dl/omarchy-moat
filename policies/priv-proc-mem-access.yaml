apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: moat-priv-proc-mem-access
  annotations:
    moat.omarchy/severity: "medium"
    moat.omarchy/title: "Another process's memory or maps read through /proc"
    moat.omarchy/enforce: "none"
    moat.omarchy/actions: "kill,ignore"
    moat.omarchy/why: >-
      /proc/<pid>/mem and /proc/<pid>/maps give a reader the plaintext of another
      process: session cookies, decrypted vault entries, ssh-agent keys. The read goes
      through the same ptrace access check as a debugger attach, in read mode.
    moat.omarchy/expected: >-
      Process viewers and profilers - htop, btop, ps, top, lsof, perf, the GNOME/KDE
      system monitors - whenever they inspect processes you own.
    moat.omarchy/fp-hint: "exe"
spec:
  options:
  - name: "policy-mode"
    value: "monitor"
  lsmhooks:
  - hook: "ptrace_access_check"
    message: "ptrace read access to another process requested"
    args:
    - index: 1
      type: "uint32"
    selectors:
    - matchBinaries:
      - operator: "NotIn"
        values:
        - "/usr/bin/htop"
        - "/usr/bin/btop"
        - "/usr/bin/ps"
        - "/usr/bin/top"
        - "/usr/bin/lsof"
        - "/usr/bin/fuser"
        - "/usr/bin/pgrep"
        - "/usr/bin/pidof"
        - "/usr/bin/perf"
        - "/usr/bin/gdb"
        - "/usr/bin/lldb"
        - "/usr/bin/strace"
        - "/usr/bin/gnome-system-monitor"
        - "/usr/bin/plasma-systemmonitor"
        - "/usr/lib/systemd/systemd-coredump"
        - "/usr/lib/systemd/systemd"
      matchArgs:
      - index: 1
        operator: "Mask"
        values: ["1"]
      matchActions:
      - action: Post
        rateLimit: "300s"
        rateLimitScope: "process"
