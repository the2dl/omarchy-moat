apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: moat-rootkit-sensor-tamper
  annotations:
    moat.omarchy/severity: "critical"
    moat.omarchy/title: "Moat's own settings, detections, services or binaries written"
    moat.omarchy/enforce: "none"
    moat.omarchy/actions: "kill,ignore"
    moat.omarchy/why: >-
      One line in /etc/moat/allowlist.d silences a whole detection; one edit under
      /etc/tetragon stops the sensor exporting anything at all; deleting a file from
      /run/moat/policies removes a detection at the next start. Blinding the sensor is
      cheaper for an attacker than avoiding it, and it leaves the panel still saying
      "watching".
    moat.omarchy/expected: >-
      Moat writing its own settings when you press "this was me", an upgrade replacing
      these files, and you editing them with sudo and an editor. All three are excluded,
      so what is left is another program rewriting the thing that watches it.
    moat.omarchy/fp-hint: "exe+file"
spec:
  options:
  - name: "policy-mode"
    value: "monitor"
  kprobes:
  - call: "security_file_post_open"
    syscall: false
    message: "Moat's own settings, detections, services or binaries opened for writing"
    args:
    - index: 0
      type: "file"
    - index: 1
      type: "int"
    selectors:
    # Basenames rather than absolute paths: the editors have to be excluded and
    # matchBinaries takes one entry per selector, so one operator has to cover
    # both the daemons and whatever the user's $EDITOR resolves to.
    - matchNamespaces:
      - namespace: Mnt
        operator: "In"
        values:
        - "host_ns"
      matchBinaries:
      - operator: "NotPostfix"
        values:
        - "/moatd"
        - "/moatctl"
        - "/moat-feeds"
        - "/tetragon"
        - "/pacman"
        - "/bsdtar"
        - "/tar"
        - "/install"
        - "/systemd-tmpfiles"
        - "/systemctl"
        - "/nvim"
        - "/vim"
        - "/nano"
        - "/emacs"
        - "/code"
        - "/zed"
        - "/hx"
        - "/sudoedit"
      matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        # settings, learned and user silences
        - "/etc/moat/"
        # the detections the sensor actually loads, and the shipped templates
        - "/run/moat/policies/"
        - "/usr/lib/moat/"
        # what the sensor exports, and where it exports it
        - "/etc/tetragon/"
        # the units that keep both of them running
        - "/usr/lib/systemd/system/moat"
        - "/usr/lib/systemd/system/tetragon"
        - "/etc/systemd/system/moat"
        - "/etc/systemd/system/tetragon"
        # trojaning the binaries themselves
        - "/usr/bin/moat"
        - "/usr/bin/tetra"
      - index: 1
        operator: "Mask"
        values: ["2"]
      matchActions:
      - action: Post
        rateLimit: "60s"
        rateLimitScope: "process"
  # Deleting a detection is quieter than editing one. Argument 0 is the parent
  # directory, which is why the unit files are not covered here: their parent is
  # /usr/lib/systemd/system, and a prefix that wide would report every unit any
  # package ever removes.
  - call: "security_path_unlink"
    syscall: false
    message: "A file was deleted from Moat's own settings or detections"
    args:
    - index: 0
      type: "path"
    - index: 1
      type: "dentry"
    selectors:
    # The HOST's copy of this path, not every container's.
    #
    # A path is namespace-relative and this policy matches the STRING, so a
    # container writing its OWN copy -- a different file, on a different
    # filesystem, meaning nothing to this machine -- matched. Found three times
    # on 2026-09-07 before this was swept. `host_ns` is resolved by tetragon at
    # load; no inode is pinned.
    - matchNamespaces:
      - namespace: Mnt
        operator: "In"
        values:
        - "host_ns"
      matchBinaries:
      - operator: "NotPostfix"
        values:
        - "/moatd"
        - "/moatctl"
        - "/moat-feeds"
        - "/tetragon"
        - "/pacman"
        - "/bsdtar"
        - "/tar"
        - "/install"
        - "/systemd-tmpfiles"
        - "/systemctl"
        - "/nvim"
        - "/vim"
        - "/nano"
        - "/emacs"
        - "/code"
        - "/zed"
        - "/hx"
        - "/sudoedit"
      matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "/etc/moat"
        - "/run/moat/policies"
        - "/usr/lib/moat"
        - "/etc/tetragon"
      matchActions:
      - action: Post
        rateLimit: "60s"
        rateLimitScope: "process"
