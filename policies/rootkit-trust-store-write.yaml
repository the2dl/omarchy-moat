apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: moat-rootkit-trust-store-write
  annotations:
    moat.omarchy/severity: "high"
    moat.omarchy/title: "/etc/hosts or the system certificate store written"
    moat.omarchy/enforce: "none"
    moat.omarchy/actions: "kill,ignore"
    moat.omarchy/why: >-
      One line in /etc/hosts sends registry.npmjs.org to somebody else's machine, and
      every install after that is compromised with no error and no warning. One file in
      the certificate anchors makes that interception show a valid padlock to every
      program on this machine, including the ones checking signatures.
    moat.omarchy/expected: >-
      A package upgrade, update-ca-trust or p11-kit rebuilding the bundle, your network
      manager, and you editing /etc/hosts with sudo and an editor. All excluded. These
      are small files that essentially nothing else writes.
    moat.omarchy/fp-hint: "exe+file"
spec:
  options:
  - name: "policy-mode"
    value: "monitor"
  kprobes:
  - call: "security_file_post_open"
    syscall: false
    message: "Name resolution or certificate trust file opened for writing"
    args:
    - index: 0
      type: "file"
    - index: 1
      type: "int"
    selectors:
    - matchBinaries:
      - operator: "NotPostfix"
        values:
        - "/pacman"
        - "/bsdtar"
        - "/tar"
        - "/install"
        - "/trust"
        - "/update-ca-trust"
        - "/p11-kit"
        - "/certutil"
        - "/c_rehash"
        - "/openssl"
        - "/systemd-resolved"
        - "/systemd-networkd"
        - "/NetworkManager"
        - "/dhcpcd"
        - "/dhclient"
        - "/tailscaled"
        - "/dockerd"
        - "/podman"
        - "/nvim"
        - "/vim"
        - "/nano"
        - "/emacs"
        - "/code"
        - "/zed"
        - "/hx"
        - "/sudoedit"
      matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        # also matches hosts.allow / hosts.deny, which are the same kind of file
        - "/etc/hosts"
        - "/etc/ca-certificates/"
        - "/usr/share/ca-certificates/"
        - "/etc/ssl/certs/"
        - "/etc/pki/"
      - index: 1
        operator: "Mask"
        values: ["2"]
      matchActions:
      - action: Post
        rateLimit: "60s"
        rateLimitScope: "process"
