apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: moat-cred-gnupg-keyring-read
  annotations:
    moat.omarchy/severity: "high"
    moat.omarchy/title: "GPG private key or login keyring read by an unexpected program"
    moat.omarchy/rotate: "gpg-key,keyring"
    moat.omarchy/enforce: "none"
    moat.omarchy/actions: "kill,quarantine,ignore"
    moat.omarchy/why: >-
      The GnuPG private key store and the GNOME login keyring hold your signing key and
      every password an application ever saved; a copy of these plus a keylogged
      passphrase is a complete identity theft.
    moat.omarchy/expected: >-
      gpg and its agents, gnome-keyring-daemon, seahorse, keepassxc, pass, secret-tool,
      and backup tools that archive your whole home directory.
    moat.omarchy/fp-hint: "exe"
spec:
  options:
  - name: "policy-mode"
    value: "monitor"
  lsmhooks:
  - hook: "file_post_open"
    message: "GPG private key or login keyring opened for reading"
    args:
    - index: 0
      type: "file"
    - index: 1
      type: "int"
    selectors:
    - matchBinaries:
      - operator: "NotPostfix"
        values:
        - "/gpg"
        - "/gpg2"
        - "/gpg-agent"
        - "/gpgconf"
        - "/gpgsm"
        - "/scdaemon"
        - "/dirmngr"
        - "/keyboxd"
        - "/gnome-keyring-daemon"
        - "/seahorse"
        - "/keepassxc"
        - "/pass"
        - "/secret-tool"
        - "/kwalletd6"
      matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "{{HOME}}/.gnupg/private-keys-v1.d/"
        - "{{HOME}}/.local/share/keyrings/"
      - index: 1
        operator: "Mask"
        values: ["4"]
      matchActions:
      - action: Post
        rateLimit: "60s"
        rateLimitScope: "process"
