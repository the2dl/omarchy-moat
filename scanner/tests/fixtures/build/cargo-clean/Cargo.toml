[package]
name = "ordinary-app"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["sub"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
sub = { path = "sub" }
anyhow = "1"
patched = { git = "https://github.com/example/patched", rev = "9f1c2b3a4d5e6f708192a3b4c5d6e7f809a1b2c3" }

[build-dependencies]
cc = "1.0"
pkg-config = "0.3"
