# /etc/sentinel/scanner-allow.conf
#
# System-wide allow file for `sentinel-scan-pkgbuild`. Read on every run,
# together with the per-user copy at ~/.config/sentinel/scanner-allow.conf
# ($XDG_CONFIG_HOME honoured), which is where `sentinelctl`-style day-to-day
# exceptions belong -- edit that one, not this one, unless the exception is
# meant for every user on the machine.
#
# Format: one entry per line. Keys on the same line are ANDed. '#' starts a
# comment. Suppressed findings are still counted in the human-readable output
# ("... hidden by allow rules"), so nothing an allow rule silences becomes
# invisible.
#
#   host=<hostname>   trust a source host, subdomains included
#   rule=<id>         silence a rule everywhere; globs work (rule=persist.*)
#   pkg=<name>        trust one package entirely (matches pkgbase/pkgname)
#
# Rule ids are family.rule: net, obf, pkg, src, persist, priv, uni, install.
# `sentinel-scan-pkgbuild --json` prints the exact id of every finding.
#
# Examples -- all commented out; this file ships empty on purpose:
#
#host=downloads.slack-edge.com
#rule=src.skip-checksum
#rule=persist.*
#pkg=my-electron-app
#pkg=my-electron-app rule=pkg.nested-package-manager
