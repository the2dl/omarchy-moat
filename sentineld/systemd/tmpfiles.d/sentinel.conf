# Type Path                          Mode UID  GID      Age Argument
d /var/lib/sentinel                  0750 root sentinel -   -
d /var/lib/sentinel/feeds            0750 root sentinel -   -
# Quarantined files are root-only: nothing in the sentinel group should be able
# to read a sample back out, let alone re-execute it.
d /var/lib/sentinel/quarantine       0700 root root     -   -
d /var/log/sentinel                  0750 root sentinel -   -
d /run/sentinel                      0750 root sentinel -   -
d /run/sentinel/policies             0750 root sentinel -   -
# Created empty so the plugin can tail it before the first alert exists.
f /var/lib/sentinel/alerts.jsonl     0640 root sentinel -   -
