# rendered by `sentineld render-policies` — edit the template, not this file
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: sentinel-cred-ssh-private-key-read
  annotations:
    sentinel.omarchy/severity: high
    sentinel.omarchy/title: Private SSH key read by an unexpected program
    sentinel.omarchy/rotate: ssh-key
    sentinel.omarchy/enforce: kill
    sentinel.omarchy/actions: kill,quarantine
    sentinel.omarchy/why: Private keys are the first thing npm and PyPI stealers read; only ssh, git and a few tools ever need them.
    sentinel.omarchy/expected: Backup tools, IDE git integrations, and custom scripts that call ssh libraries.
    sentinel.omarchy/fp-hint: exe
spec:
  options:
  - name: policy-mode
    value: monitor
  lsmhooks:
  - hook: file_post_open
    message: SSH private key opened
    args:
    - index: 0
      type: file
    - index: 1
      type: int
    selectors:
    - matchBinaries:
      - operator: NotIn
        values:
        - /usr/bin/ssh
        - /usr/bin/ssh-add
        - /usr/bin/ssh-keygen
        - /usr/bin/git
      matchArgs:
      - index: 0
        operator: Prefix
        values:
        - /home/dan/.ssh/id_
      - index: 1
        operator: Mask
        values:
        - '4'
      matchActions:
      - action: Post
        rateLimit: 10s
        rateLimitScope: process
