apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: sentinel-priv-setuid-chmod
  annotations:
    sentinel.omarchy/severity: critical
    sentinel.omarchy/title: "setuid or setgid bit set on a file"
    sentinel.omarchy/enforce: "kill"
    sentinel.omarchy/actions: "kill,quarantine"
    sentinel.omarchy/why: >-
      A setuid file is a permanent root door. Package managers set them at install time
      through pacman; almost nothing else should.
    sentinel.omarchy/expected: >-
      pacman and makepkg during an install, and container tooling such as newuidmap.
    sentinel.omarchy/fp-hint: "exe"
spec:
  options:
  - name: policy-mode
    value: monitor
  lsmhooks:
  - hook: "path_chmod"
    message: "setuid bit set on a file"
    args:
    - index: 0
      type: "path"
    - index: 1
      type: "uint32"
    selectors:
    - matchBinaries:
      - operator: "NotIn"
        values:
        - "/usr/bin/pacman"
      matchArgs:
      - index: 1
        operator: "Mask"
        values:
        - "2048"
        - "1024"
