# omarchy-moat sandbox configuration
#
# Installed as /etc/moat/sandbox.conf (root:root 0644). A per-user file at
# ~/.config/moat/sandbox.conf is read afterwards and can only add entries;
# it cannot remove one added here except with an exactly matching `allow=`.
#
# Syntax: one `key=value` per line. `#` starts a comment. Leading and trailing
# whitespace is trimmed. `~/` and `$HOME/` at the start of a path expand to the
# invoking user's home directory. Unknown keys are reported on stderr and
# ignored.
#
#   deny=PATH       hide PATH inside the sandbox. A directory is covered with
#                   an empty tmpfs; a file is replaced with an empty read-only
#                   file. Non-existent paths are skipped.
#   allow=PATH      bind PATH read-write inside the sandbox and drop it from
#                   the deny list (exact match). Same as `--allow PATH`.
#   keep-env=NAME   do not strip the environment variable NAME.
#
# Verify what a command will actually get with:
#   moat-sandbox --dry-run -- npm install


# ---------------------------------------------------------------------------
# Denied by default (compiled into moat-sandbox; listed here so the set is
# visible and so a line can be turned into an `allow=` when you need it).
# ---------------------------------------------------------------------------
deny=~/.ssh
deny=~/.aws
deny=~/.config/gh
deny=~/.claude
deny=~/.codex
deny=~/.gemini
deny=~/.gnupg
deny=~/.local/share/keyrings
deny=~/.mozilla
deny=~/.config/chromium
deny=~/.config/google-chrome
deny=~/.config/BraveSoftware
deny=~/.docker/config.json
deny=~/.kube
deny=~/.netrc
deny=~/.git-credentials
deny=~/.config/op
deny=~/.password-store

# Not denied, on purpose:
#
#   ~/.npmrc, ~/.pypirc   Left readable (read-only, like the rest of the
#                         root filesystem) because installs from a private
#                         registry need the auth token in them. TRADE-OFF: a
#                         malicious postinstall script can read that token.
#                         If you do not use private registries, uncomment:
# deny=~/.npmrc
# deny=~/.pypirc
#
#   ~/.local/share/omarchy   Needed by omarchy tooling that runs inside builds.
#   ~/.config/git, ~/.gitconfig   Needed for commit identity during builds.
#                                 Credentials live in ~/.git-credentials,
#                                 which is denied.


# ---------------------------------------------------------------------------
# Always writable (compiled in): $PWD, the git toplevel of $PWD, a tmpfs on
# /tmp, and the package caches ~/.npm ~/.cache ~/.cache/pip
# ~/.local/share/pnpm ~/.cargo/registry ~/.cargo/git ~/.rustup
# ~/.local/share/mise ~/.local/share/uv ~/.bun ~/.yarn
#
# Add your own, e.g. a shared vendor directory or a non-default PKGDEST:
# allow=~/build/pkgdest
# ---------------------------------------------------------------------------


# ---------------------------------------------------------------------------
# Environment. moat-sandbox unsets every variable matching *_TOKEN,
# *_SECRET, *_KEY, AWS_*, GITHUB_TOKEN or NPM_TOKEN. Keep the ones a build
# legitimately needs:
# keep-env=NPM_TOKEN
# keep-env=CARGO_REGISTRY_TOKEN
# ---------------------------------------------------------------------------
