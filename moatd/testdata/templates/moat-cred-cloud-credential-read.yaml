apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: moat-cred-cloud-credential-read
  annotations:
    moat.omarchy/severity: high
    moat.omarchy/title: "Cloud or CLI credential file read"
    moat.omarchy/rotate: "aws,gh,npm-token"
    moat.omarchy/enforce: "none"
    moat.omarchy/actions: "kill,quarantine"
    moat.omarchy/why: >-
      Long-lived cloud and registry tokens sit in plain files; a build step that reads them
      is either exfiltrating or about to.
    moat.omarchy/expected: >-
      The matching CLI itself (aws, gh, npm), and credential helpers you installed.
    moat.omarchy/fp-hint: "exe+file"
spec:
  options:
  - name: policy-mode
    value: monitor
  kprobes:
  - call: "security_file_permission"
    syscall: false
    return: true
    args:
    - index: 0
      type: "file"
    - index: 1
      type: "int"
    returnArg:
      index: 0
      type: "int"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Equal"
        values:
        - "{{HOME}}/.aws/credentials"
        - "{{HOME}}/.config/gh/hosts.yml"
        - "{{HOME}}/.npmrc"
      - index: 1
        operator: "Equal"
        values:
        - "4"
