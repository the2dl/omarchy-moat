# /etc/moat/feeds.toml — malicious-package feed configuration for `moat-feeds`.
#
# No credential lives here any more. moat used to fetch abuse.ch
# (MalwareBazaar / ThreatFox / URLhaus), which requires an Auth-Key, so a
# machine without a key had no feed at all. It now pulls signed, keyless
# artifacts from an aggregator: the malicious-package index that the six
# scanners read offline before an install runs (docs/PACKAGE-FEED.md), and a
# ~48k-entry malicious-domain list matched against the hostname behind each
# outbound connection (docs/DOMAIN-FEED.md). ThreatFox is the source of the
# second one and still needs no key here: its bulk exports are unauthenticated
# and only the aggregator reads them.
#
# Both arrive through one pointer.json and are verified with the same key.
# The domain list installs as feeds/domains-feed.txt. Your own
# feeds/domains.txt is never written by a refresh, and wins a tie.

enabled = true

# Where the signed index is published. Override to point at a mirror.
base_url = "https://feed.runts.net"

# The index decides what moat warns about, so it is verified before it is
# applied. Turning this off means trusting whoever can answer for base_url;
# it exists for local mirror testing, not for production.
require_signature = true

# ed25519 public key, shipped with the package. Set `public_key` inline
# (hex or base64) to override the file.
public_key_path = "/usr/share/moat/feed-key.pub"
public_key = ""

# Per-request timeout.
timeout_secs = 30

# Ceilings on what a server may hand us. The full index is ~1.6 MB gzipped.
max_artifact_bytes = 67108864
max_pointer_bytes = 262144
