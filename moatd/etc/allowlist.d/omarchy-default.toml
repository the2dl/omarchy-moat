# /etc/moat/allowlist.d/omarchy-default.toml — shipped baseline (LEARNING §8).
#
# Reviewed once by a human, shipped in the package, replaced on upgrade. It
# belongs to the package, so `moatctl allowlist` reports every entry here as
# `source: shipped` and `removable: false`, and `moatctl unignore --file
# omarchy-default.toml` refuses. To override one, add a narrower rule of your
# own to user.toml, or use `moatctl ignore`.
#
# Every entry carries a comment saying which actor, which rule, and why it is
# benign — that is the rule for this file, not a convention.
#
# ---------------------------------------------------------------------------
# moat's own build and tests are not incidents (BASELINE §5)
# ---------------------------------------------------------------------------
#
# The daemon's test suite proves its rules against real processes: it copies
# `sleep` to `<tmpdir>/nc` and executes it to show that the netcat rule fires
# and that enforce mode kills, and it executes small helpers from temp
# directories. The scanner suite does the same one level up: it builds a fake
# toolchain in a `tempfile.mkdtemp` directory and runs the real `sandbox/shims`
# against it. On the machine that develops moat, `cargo test` and `makepkg`
# would therefore raise alerts every run — which is exactly how a security tool
# teaches its owner to ignore it.
#
# **Which field names the binary depends on the hook, and getting that wrong
# writes an entry that can never fire.** `engine::emit` builds the allowlist
# candidate as `exe` = the acting process, `file` = the path the hook named,
# `parents` = every exe in the ancestry:
#
#   * `moat-exec-untrusted-tmpfs` hangs off `bprm_check_security`, so the actor
#     is the CALLER (the cargo test binary, or the bash the shim invoked) and
#     the executed binary is `file`;
#   * `moat-pkg-subtree-netcat-exec` is a userland rule whose actor is `nc`
#     itself, so there the executed binary IS `exe`;
#   * `moat-priv-setuid-chmod` hangs off `path_chmod`, where the actor is the
#     test binary and its own exe does NOT appear in the ancestry.
#
# alerts were unsuppressed, the shim suites added 1132 more, and two
# `moat-priv-setuid-chmod` alerts pushed two `cargo test` chains to CRITICAL —
# which triggered an automatic quarantine attempt on the repo's own moatctl.
#
# The scope is still deliberately as narrow as it can be written:
#
#     produces) or the suite's own `mkdtemp` prefix, never `/tmp/*`;
#   * the basename is `nc` or `moat-*` where the suite only uses those names;
#     test binary cargo builds and `*/sandbox/shims/*` is a shim script from
#     this tree, neither of which anything else on the machine is.
#
# Every field present must match (CONTRACT §6.3), so a real dropper in /tmp, or
# the same binary run from a shell, still alerts.

# `cargo test` executes a copied `sleep` named `nc` from a tempdir to prove the
# exec-from-tmpfs rule fires and that enforce mode kills it. The actor is the
# The netcat rule is the one those tests exist to exercise: a fake `nc` under a
# omarchy-shell runs its plugins' own scripts. A plugin is a directory under
# ~/.config/omarchy/plugins holding QML plus executable helpers, and the shell
# spawns those helpers as part of drawing the bar — `scripts/config` alone fires
# every ~30s, which on 2026-09-03 was 8 high alerts a minute on an idle desktop.
#
# Scoped by ancestry, not by actor: a plugin helper is often run through an
# interpreter, so the process doing the exec is python3.14 or bash as often as it
# is quickshell itself — scoping on exe caught only a third of them. `parent`
# matches any ancestor, so this says "somewhere under the shell", which is the
# thing that is actually trustworthy here.
#
# It does not weaken the rule generally: the same script executed from a shell
# you opened, or from anything not descended from omarchy-shell, still fires. And
# a plugin *appearing or changing* is a different question entirely, still
# covered by moat-persist-omarchy-plugin-write.
[[rule]]
name = "moat-exec-untrusted-home"
parent = "/usr/bin/quickshell"
file = "/home/*/.config/omarchy/plugins/*"

# The bar's agent-usage widget reads the Claude credentials file to report your
# usage. omarchy-agent-usage-claude is an Omarchy binary under /usr/share, run by
# omarchy-agent-usage-update from the shell, and reading that file is the whole
# job — but it is also literally what credential theft looks like, which is why
# the rule fires and why this entry names the one binary rather than the family.
#
# Anything else reading ~/.claude/.credentials.json still fires, including the
# same file read by a different Omarchy helper.
[[rule]]
name = "moat-cred-ai-credentials-read"
exe = "/usr/share/omarchy/bin/omarchy-agent-usage-claude"
file = "/home/*/.claude/.credentials.json"

# The sandbox suite builds a fake toolchain under /tmp/moat-sandbox-test.*/bin
# and runs the real shims against it, so the shim execs a binary from a tmpfs —
# which is the rule, exercised on purpose. Scoped by ancestry rather than by
# actor for the same reason as the plugin entry above: the exec is done by bash
# or env as often as by the shim itself. A binary under that prefix executed
# `scanner/tests/test_npm_shim.py` is the same idea for the node shims: it
# builds a fake `npm`/`yarn`/`pnpm`/`bun` toolchain under
# /tmp/moat-shim-test.* with `tempfile.mkdtemp(prefix="moat-shim-test.")` and
# runs the shipped shims against it, from `python3 -m unittest` in the
# PKGBUILD's check(). The entry above only named the sandbox suite's prefix, so
# on 2026-09-05 these were 348 unsuppressed alerts in one day. Same ancestry
# ...and `scanner/tests/test_build_shim.py` for the build shims
# (cargo/pip/pip3/uv/go), under its own /tmp/moat-build-shim-test.* prefix:
# 784 unsuppressed alerts on 2026-09-05, the single noisiest shape on the
# `cargo test` runs the incident writer against a real directory tree, and
# writing an incident chmods the files it drops — which is `moat-priv-setuid-chmod`
# doing its job on moat's own test fixtures. Two of those on 2026-09-05 were
# enough to carry two `cargo test` chains to CRITICAL and start an automatic
# quarantine of the repo's own `target/release/moatctl`.
#
# Scoped by ACTOR, not by ancestry: `path_chmod` names the test binary as the
# actor and its ancestry begins at `/usr/bin/cargo`, so the binary never appears
# in `parents` and a `parent` glob here would be dead on arrival. The exe glob is
# the hashed cargo test binary, and the file must be inside a `tempfile` scratch
# Moat's own unattended triage (LEARNING §2c) launches the user's agent with no
# terminal, which is what `moat-x-ai-cli-headless` looks for. There is NO
# allowlist entry for it, and two attempts to write one are worth recording so
# nobody writes a third:
#
#   parent = "*/moat-sandbox"   -- can never match. moat-sandbox is a shell
#     script ending in `exec bwrap`, so the process BECOMES bwrap and never
#     appears in the ancestry at all.
#   parent = "*/moatctl"        -- misses `/usr/bin/moatctl (deleted)`, which is
#     what the ancestry reads after pacman replaces the binary mid-run.
#
# The real cause of the noise was neither: `claude` is a multi-call binary that
# re-execs itself as its own bundled `rg`, so ordinary file searches arrived as
# agent launches. That is fixed in `rules/ai_cli.rs` by looking at the argv
# instead of the binary's name, which is where a discriminator of this kind
# belongs -- an allowlist entry would have silenced the real case too.
