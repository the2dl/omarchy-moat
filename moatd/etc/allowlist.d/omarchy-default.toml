# /etc/moat/allowlist.d/omarchy-default.toml — shipped baseline (LEARNING §8).
#
# Reviewed once by a human, shipped in the package, replaced on upgrade. It
# belongs to the package, so `moatctl allowlist` reports every entry here as
# `source: shipped` and `removable: false`, and `moatctl unignore --file
# omarchy-default.toml` refuses. To override one, add a narrower rule of your
# own to user.toml, or use `moatctl ignore`.
#
# Every entry carries a comment saying which actor, which rule, and why it is
# benign — that is the rule for this file, not a convention.
#
# ---------------------------------------------------------------------------
# moat's own build and tests are not incidents (BASELINE §5)
# ---------------------------------------------------------------------------
#
# The daemon's test suite proves its rules against real processes: it copies
# `sleep` to `<tmpdir>/nc` and executes it to show that the netcat rule fires
# and that enforce mode kills, and it executes small helpers from temp
# directories. On the machine that develops moat, `cargo test` would therefore
# raise a critical alert every run — which is exactly how a security tool
# teaches its owner to ignore it.
#
# The scope is deliberately as narrow as it can be written:
#
#   * the exe glob is `/tmp/.tmp*/…`, the shape `tempfile::tempdir()` produces,
#     never `/tmp/*`;
#   * the basename is `nc` or `moat-*`, the only names the suite uses;
#   * `parent` must be a cargo test runner — `*/target/*/deps/moatd-*` is the
#     hashed test binary cargo builds, which nothing else on the machine is.
#
# All three must match (CONTRACT §6.3: every field present must match), so a
# real dropper in /tmp, or the same binary run from a shell, still alerts.

# `cargo test` executes a copied `sleep` named `nc` from a tempdir to prove the
# exec-from-tmpfs rule fires and that enforce mode kills it.
[[rule]]
name = "moat-exec-untrusted-tmpfs"
exe = "/tmp/.tmp*/nc"
parent = "*/target/*/deps/moatd-*"

# The same suite executes its own helpers (`moat-*`) out of a tempdir.
[[rule]]
name = "moat-exec-untrusted-tmpfs"
exe = "/tmp/.tmp*/moat-*"
parent = "*/target/*/deps/moatd-*"

# The netcat rule is the one those tests exist to exercise: a fake `nc` under a
# cargo test runner is the test, not an install script opening a shell.
[[rule]]
name = "moat-pkg-subtree-netcat-exec"
exe = "/tmp/.tmp*/nc"
parent = "*/target/*/deps/moatd-*"

# ...and the same for the suite's own helpers.
[[rule]]
name = "moat-pkg-subtree-netcat-exec"
exe = "/tmp/.tmp*/moat-*"
parent = "*/target/*/deps/moatd-*"

# omarchy-shell runs its plugins' own scripts. A plugin is a directory under
# ~/.config/omarchy/plugins holding QML plus executable helpers, and the shell
# spawns those helpers as part of drawing the bar — `scripts/config` alone fires
# every ~30s, which on 2026-09-03 was 8 high alerts a minute on an idle desktop.
#
# Scoped by ancestry, not by actor: a plugin helper is often run through an
# interpreter, so the process doing the exec is python3.14 or bash as often as it
# is quickshell itself — scoping on exe caught only a third of them. `parent`
# matches any ancestor, so this says "somewhere under the shell", which is the
# thing that is actually trustworthy here.
#
# It does not weaken the rule generally: the same script executed from a shell
# you opened, or from anything not descended from omarchy-shell, still fires. And
# a plugin *appearing or changing* is a different question entirely, still
# covered by moat-persist-omarchy-plugin-write.
[[rule]]
name = "moat-exec-untrusted-home"
parent = "/usr/bin/quickshell"
file = "/home/*/.config/omarchy/plugins/*"

# The bar's agent-usage widget reads the Claude credentials file to report your
# usage. omarchy-agent-usage-claude is an Omarchy binary under /usr/share, run by
# omarchy-agent-usage-update from the shell, and reading that file is the whole
# job — but it is also literally what credential theft looks like, which is why
# the rule fires and why this entry names the one binary rather than the family.
#
# Anything else reading ~/.claude/.credentials.json still fires, including the
# same file read by a different Omarchy helper.
[[rule]]
name = "moat-cred-ai-credentials-read"
exe = "/usr/share/omarchy/bin/omarchy-agent-usage-claude"
file = "/home/*/.claude/.credentials.json"

# The sandbox suite builds a fake toolchain under /tmp/moat-sandbox-test.*/bin
# and runs the real shims against it, so the shim execs a binary from a tmpfs —
# which is the rule, exercised on purpose. Scoped by ancestry rather than by
# actor for the same reason as the plugin entry above: the exec is done by bash
# or env as often as by the shim itself. A binary under that prefix executed
# outside a shim, or any other tmpfs path, still fires.
[[rule]]
name = "moat-exec-untrusted-tmpfs"
file = "/tmp/moat-sandbox-test.*/*"
parent = "*/sandbox/shims/*"
