# /etc/moat/allowlist.d/default.toml — shipped defaults.
#
# Every *.toml in this directory is merged in file-name order. This file belongs
# to the package and is replaced on upgrade: put your own rules in user.toml
# (which is what `moatctl ignore` writes) or in a file of your own.
#
# Shape (CONTRACT §6.3): all fields optional except `name`, globs allowed
# (`*` matches any run of characters, `?` one character), and EVERY field
# present must match for the rule to suppress an alert.
#
#   [[rule]]
#   name   = "moat-cred-ssh-private-key-read"  # or "moat-cred-*"
#   exe    = "/usr/bin/restic"                     # the process itself
#   file   = "/home/dan/.ssh/id_rsa"               # the file it touched
#   parent = "/usr/bin/systemd"                    # ANY ancestor, up to 8 deep
#
# A rule that names `file` can never match an alert that has no file (a network
# alert, for instance) — that is deliberate, so a broad `file` glob cannot
# silently disable a whole family.
#
# The comment line directly above each [[rule]] is what `moatctl allowlist`
# shows, so always leave one. `moatctl unignore <n>` removes a rule, but
# only from user.toml.

# ssh is the whole reason ~/.ssh exists; without this every `git push` alerts.
[[rule]]
name = "moat-cred-*"
exe = "/usr/bin/ssh"

# ssh-agent holds the decrypted keys by design.
[[rule]]
name = "moat-cred-*"
exe = "/usr/bin/ssh-agent"

# ssh-add reads the key file to load it into the agent.
[[rule]]
name = "moat-cred-*"
exe = "/usr/bin/ssh-add"

# ssh-keygen reads and writes keys; that is its only job.
[[rule]]
name = "moat-cred-*"
exe = "/usr/bin/ssh-keygen"

# git reads ~/.ssh/config and ~/.git-credentials constantly. Scoped to the cred
# family only: git doing something in the priv or persist families still fires.
[[rule]]
name = "moat-cred-*"
exe = "/usr/bin/git"

# sshd reads host keys and authorized_keys on every inbound connection.
[[rule]]
name = "moat-cred-*"
exe = "/usr/bin/sshd"

# The keyring daemon's job is holding your secrets; it reads the keyring files
# on every unlock and every libsecret query.
[[rule]]
name = "moat-cred-*"
exe = "/usr/bin/gnome-keyring-daemon"

# systemd-coredump ptrace-attaches to every crashing process, which otherwise
# looks exactly like a memory scraper.
[[rule]]
name = "moat-priv-ptrace-*"
exe = "/usr/lib/systemd/systemd-coredump"

# pacman sets setuid bits during installs (newuidmap, ping, mount helpers).
# `parent` matches any ancestor, so this covers the helpers pacman runs too.
[[rule]]
name = "moat-priv-setuid-*"
parent = "/usr/bin/pacman"

# The AI CLIs are exactly what moat-x-ai-cli-headless watches. If you run
# one from a systemd user unit or a cron job on purpose, uncomment and edit this
# rather than turning the rule off, so an *unexpected* headless agent still
# fires.
#
# [[rule]]
# name   = "moat-x-ai-cli-headless"
# parent = "/usr/lib/systemd/systemd"

# ---------------------------------------------------------------- cloud CLIs
#
# A program reading ITS OWN credential store is not an exfil. `ssh` reading
# ~/.ssh is excluded in the kernel by the cred-* policies; the cloud CLIs
# cannot be, because they are scripts and `matchBinaries` only ever sees the
# interpreter (see `util::interpreter_of`).
#
# 2026-09-07, live: `gcloud iam service-accounts list --project=...` read
# ~/.config/gcloud/credentials.db and then called Google -- a credential read
# followed by egress, which is the exfil shape exactly. The chain went high and
# moat CONTAINED it mid-command. There was no way to allow it: `exe` was
# /usr/bin/python3.14, and allowing THAT would let any python script on the
# machine read your cloud credentials.
#
# `script` is what makes these entries honest. They say "gcloud, reading
# gcloud's own store" -- not "python may read anything". A python script that
# is not gcloud still fires, which is the whole point.
#
# Delete any of these if you do not use that CLI. Each one is a real, if
# narrow, grant: it trusts that the named script is the one on disk.

# gcloud, reading gcloud's own store. Arch's google-cloud-cli layout.
[[rule]]
name   = "moat-cred-cloud-credentials-read"
script = "*/google-cloud-cli/lib/gcloud.py"
file   = "*/.config/gcloud/*"

# The same CLI installed from Google's own tarball, which uses google-cloud-sdk.
[[rule]]
name   = "moat-cred-cloud-credentials-read"
script = "*/google-cloud-sdk/lib/gcloud.py"
file   = "*/.config/gcloud/*"

# The AWS CLI v2 ships its own interpreter, so `exe` is usable there and this
# is an `exe` rule rather than a `script` one -- named here beside the others
# so the set reads as one decision.
# The AWS CLI reading ~/.aws. v2 ships its own interpreter, so `exe` is the
# honest matcher here rather than `script`.
[[rule]]
name = "moat-cred-cloud-credentials-read"
exe  = "/usr/bin/aws"
file = "*/.aws/*"

# The other script-based cloud CLIs. Same reasoning, same narrowness. These
# were written from each project's stable layout rather than measured on this
# machine -- only gcloud was -- so if one of them still alerts, the script path
# is what to check first: `moatctl explain <id>` prints it on the actor line.
# A wrong path here fails safe: the entry matches nothing and the alert stands.

# The Azure CLI is a python package; __main__.py is stable across the distro
# package, the installer and a pip install.
[[rule]]
name   = "moat-cred-cloud-credentials-read"
script = "*/azure/cli/__main__.py"
file   = "*/.azure/*"

# AWS CLI v1 is a python script (v2 ships its own interpreter and is the `exe`
# rule above). Anchored to the real install prefixes, not `*/bin/aws`, which
# would match anything called aws anywhere.
[[rule]]
name   = "moat-cred-cloud-credentials-read"
script = "/usr/bin/aws"
file   = "*/.aws/*"

# The same, installed outside the distro package.
[[rule]]
name   = "moat-cred-cloud-credentials-read"
script = "/usr/local/bin/aws"
file   = "*/.aws/*"

# Ansible reads cloud credentials through its own plugins.
[[rule]]
name   = "moat-cred-cloud-credentials-read"
script = "/usr/bin/ansible"
file   = "*/.aws/*"

# And the playbook runner, which is a separate entry point.
[[rule]]
name   = "moat-cred-cloud-credentials-read"
script = "/usr/bin/ansible-playbook"
file   = "*/.aws/*"

# ------------------------------------------------- package caches are not $HOME
#
# A persist rule asks "did something arrange to run again". That question is
# about a place your session will later EXECUTE: ~/.bashrc, a repo's real
# .git/hooks, ~/.config/systemd/user. It is not about a package manager
# unpacking a tarball into its own cache, and the two look identical from the
# kernel: a write, to a file with a persistence-shaped name.
#
# 2026-09-07, live, all from building this very project:
#   moat-persist-git-hook-write      ~/.cargo/registry/src/sharded-slab-0.1.7/.envrc
#   moat-persist-agent-config-write  ~/.claude/plugins/marketplaces/.../.mcp.json
# cargo unpacked a crate that ships a .envrc; git cloned a plugin catalog whose
# repo CONTENT is .mcp.json files. Nothing will ever execute either path --
# direnv does not load the cargo registry, and a marketplace clone is a
# catalogue, not config. Together they escalated a cargo build to a CRITICAL
# chain ("the sequence ended by arranging to run again") 50 times.
#
# These are suppressions, not deletions: the rows are still recorded and still
# show in the timeline, greyed, so nothing goes silent. Writing to the same
# NAMES anywhere real -- your home, a repo you work in -- still fires.

# Crates are tarballs; some of them ship a .envrc or a hook.
[[rule]]
name = "moat-persist-git-hook-write"
file = "*/.cargo/registry/src/*"

# The same registry when cargo is installed system-wide (rustup in /usr/local).
[[rule]]
name = "moat-persist-git-hook-write"
file = "/usr/local/cargo/registry/src/*"

# Go's module cache, which is likewise extracted source.
[[rule]]
name = "moat-persist-git-hook-write"
file = "*/go/pkg/mod/*"

# node_modules is extracted source too, at any depth.
[[rule]]
name = "moat-persist-git-hook-write"
file = "*/node_modules/*"

# A cloned plugin CATALOGUE. The operative config lives above this directory;
# what is inside a marketplace clone is repo content, written by `git checkout`.
[[rule]]
name = "moat-persist-agent-config-write"
file = "*/.claude/plugins/marketplaces/*"

# npm's content-addressed cache: extracted package payloads, never executed
# from there.
[[rule]]
name = "moat-persist-agent-config-write"
file = "*/.npm/_cacache/*"

# ------------------------------------------- moat's own test suite, on this box
#
# Building moat from source runs its tests, and its tests exec their own
# fixtures out of /tmp and the source tree -- 62 rows from one afternoon, none
# of them a finding about anything. Both matchers must hit: the actor is moat's
# own test binary in a moat build tree, AND the file is the fixture it ships.
# Neither half alone would be safe, and on a machine that never builds moat
# these match nothing at all.
[[rule]]
name = "moat-exec-untrusted-home"
exe  = "*/omarchy-moat/moatd/target/*/deps/moatd-*"
file = "*/omarchy-moat/moatd/testdata/*"

# The same suite exec'ing its fake sensor out of a temp directory.
[[rule]]
name = "moat-exec-untrusted-tmpfs"
exe  = "*/omarchy-moat/moatd/target/*/deps/moatd-*"
file = "/tmp/*/tetra"

# --------------------------------- crate sources are extracted, not installed
#
# A crate tarball can ship anything, including files whose NAMES are the shapes
# the persist rules look for: AGENTS.md, .vscode/tasks.json, a git hook. cargo
# unpacking one into its registry cache is extraction; nothing will ever run it
# from there. The git-hook half of this was covered already; the agent-config
# half was not, and produced 17 rows.
[[rule]]
name = "moat-persist-agent-config-write"
file = "*/.cargo/registry/src/*"

# The same registry when cargo is installed system-wide.
[[rule]]
name = "moat-persist-agent-config-write"
file = "/usr/local/cargo/registry/src/*"

# ------------------------------- a dependency tree is extracted, not installed
#
# Fourth instance of one shape in a day: a package manager unpacks a dependency
# that happens to SHIP a file whose name is one the persist rules watch, and the
# unpack reads as somebody arranging to run again.
#
# 2026-09-08, live: `pnpm install` unpacked recharts, which ships an AGENTS.md,
# into node_modules/.pnpm/recharts@3.8.1_.../recharts_tmp_696437/AGENTS.md. The
# card said it "runs automatically on your next login" and the sequence
# escalated to CRITICAL off 57 events in two seconds. Nothing reads AGENTS.md
# from inside a transitive dependency: the rule's own reasoning -- that these
# files are "executed or obeyed by tools that already have your permissions" --
# is true of ~/.claude/settings.json and false of a vendored copy six
# directories down.
#
# The git-hook half of this was covered when cargo did it; the agent-config
# half was not. These are suppressions, so the rows are still recorded and
# still show greyed in the timeline -- and writing the same names anywhere
# REAL, including the top of your own project, still fires.

# npm/pnpm/yarn dependency trees, at any depth.
[[rule]]
name = "moat-persist-agent-config-write"
file = "*/node_modules/*"

# pnpm's content-addressed store, which is where the tarballs land first.
[[rule]]
name = "moat-persist-agent-config-write"
file = "*/.pnpm-store/*"

# yarn's cache, the same idea under a different name.
[[rule]]
name = "moat-persist-agent-config-write"
file = "*/.yarn/cache/*"

# Go module cache: extracted source, read-only by design, never executed there.
[[rule]]
name = "moat-persist-agent-config-write"
file = "*/go/pkg/mod/*"

# ------------------- a container runtime unpacking an image into its own store
#
# 2026-09-08, overnight: 85 badge rows from `dockerd` alone, all of them writes
# and reads under its OWN storage --
#
#   /var/lib/containerd/io.containerd.snapshotter.v1.overlayfs/snapshots/291/fs/tenzir/AGENTS.md
#   /var/lib/docker/buildkit/containerd-overlayfs/cachemounts/.../app/tenzir/AGENTS.md
#   /var/lib/docker/volumes/<id>/_data/mail
#
# An image layer is a tarball someone else built. It can contain an AGENTS.md, a
# .npmrc, a setuid bit -- and unpacking it is extraction, not installation. The
# same reasoning as the cargo registry and node_modules entries above, one layer
# down: nothing in /var/lib/docker runs on this host until a container is
# started from it, and THAT is what the exec and net rules are for.
#
# Scoped to the runtime's own directories, so a container escaping to write
# somewhere real still fires, and so does anything writing into these paths that
# is not the runtime -- these are `file` rules, not `exe` rules, deliberately:
# naming dockerd would excuse dockerd everywhere.

# docker's image store, overlay layers, buildkit cache mounts and volumes.
[[rule]]
name = "moat-persist-agent-config-write"
file = "/var/lib/docker/*"

# containerd's snapshotter, the same store under a different name.
[[rule]]
name = "moat-persist-agent-config-write"
file = "/var/lib/containerd/*"

# Image layers carry their own .npmrc, .pypirc and cargo credentials.
[[rule]]
name = "moat-cred-project-token-read"
file = "/var/lib/docker/*"

# The same, for containerd.
[[rule]]
name = "moat-cred-project-token-read"
file = "/var/lib/containerd/*"

# Layers legitimately carry setuid binaries: sudo, ping, mount.
[[rule]]
name = "moat-priv-setuid-chmod"
file = "/var/lib/docker/*"

# The same, for containerd.
[[rule]]
name = "moat-priv-setuid-chmod"
file = "/var/lib/containerd/*"
