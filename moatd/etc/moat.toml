# /etc/moat/moat.toml — moatd configuration (root:root 0644).
#
# Everything here has a built-in default; this file only needs the values you
# want to change. Unknown keys are an error, so a typo is loud rather than
# silently ignored. Reloaded on SIGHUP (`systemctl reload moatd`).

# Group that owns the control socket and alerts.jsonl. Members can read alerts
# and act on them: sudo usermod -aG moat $USER, then log out and back in.
group = "moat"

# Starting policy mode. `moatctl set mode enforce` overrides this and
# persists the choice in state.json, so this is only the first-boot default.
#   monitor — Tetragon reports, never kills. moatd kills only when asked.
#   enforce — policies carrying matchActions Sigkill/Override act in the kernel.
mode = "monitor"

[paths]
# Tetragon's JSON export (its `export-filename`). moatd tails this and
# handles rename-rotation and truncation.
tetragon_log = "/var/log/moat/tetragon.log"

# Rendered policies. Tetragon's `tracing-policy-dir` must point here.
policies_dir = "/run/moat/policies"

# Policy templates containing {{HOME}}, shipped by the package.
templates_dir = "/usr/lib/moat/policies"

# Generated Tetragon conf.d fragment listing the exact policy names to export.
# Tetragon's policy_names filter is exact-match only, so this is regenerated on
# every `moatd render-policies`.
export_allowlist = "/etc/tetragon/tetragon.conf.d/export-allowlist"

# alerts.jsonl, state.json, quarantine/ and feeds/ live under here.
state_dir = "/var/lib/moat"

runtime_dir = "/run/moat"
socket = "/run/moat/control.sock"

# Every *.toml in this directory is merged, in file-name order.
allowlist_dir = "/etc/moat/allowlist.d"

# Presence of this file makes /etc/profile.d/moat-shims.sh put the sandbox
# shims on PATH. Toggled by `moatctl set sandbox on|off`.
sandbox_flag = "/etc/moat/sandbox.enabled"

# Existence of this socket is the "is Tetragon up?" check in `status`.
tetragon_socket = "/run/tetragon/tetragon.sock"

# Used only for `tetra tp set-mode <policy> monitor|enforce`.
tetra = "/usr/bin/tetra"

# Spawned by `moatctl feeds refresh`.
feeds_bin = "/usr/bin/moat-feeds"

# Where human users (uid >= 1000, home under /home or /var/home, real shell)
# are discovered for {{HOME}} expansion.
passwd = "/etc/passwd"

# The local pacman database, parsed once for provenance (BASELINE §1). Its
# mtime is also the "a pacman transaction happened" signal: that is when the
# database is re-read and learned baseline entries are re-checked.
pacman_local = "/var/lib/pacman/local"

# Called once per pacman transaction, for `pacman -Sl <trusted repos>`. Repo
# membership is the one fact the local database does not record. Nothing here
# ever shells out per event.
pacman = "/usr/bin/pacman"

[rules]
# Userland rules (`moat-x-*`) — the detections a TracingPolicy cannot
# express. Each can be turned off independently.

# An AI CLI (claude, codex, gemini, opencode, q, amp) with no terminal anywhere
# in its ancestry, or started with a permission-skipping flag from inside a
# package install.
ai_cli_headless = true

# A package-manager subtree connecting to an address that is neither private nor
# in net.registry_cidrs below.
pkg_egress = true

# An outbound connection to a destination this machine has never talked to.
#
# LOW on purpose: it stays on the timeline and never notifies, because the first
# time you use any service is a first contact. It exists to be the second half
# of a sequence -- a credential read and then a connection somewhere new, from
# the same process tree, is exfiltration, and the chain correlator raises that
# pair to at least high.
#
# Expect it to be chatty in the timeline for the first few days and then to go
# quiet: each destination reports at most once, ever. It will not catch a beacon
# to a host you already use, which is a real limit rather than an oversight.
net_first_contact = true

# sha256 of a newly executed file under $HOME, /tmp, /var/tmp or /dev/shm
# matching the abuse.ch hash feed.
new_exec_ioc = true

# One process reading many distinct CREDENTIAL files in seconds -- the files
# the cred-* policies posted, wherever they live. See [thresholds] below.
mass_read = true

# A binary executed from anonymous memory (memfd), shared memory, or a file
# unlinked before it ran. Tetragon reports this directly in
# `process.binary_properties.file`, which it populates for nothing else, so
# there is no path-matching guesswork and no extra kernel cost -- exec events
# are exported unconditionally. Rare, and deliberate when it happens: a program
# that was never written to disk cannot be scanned, hashed or quarantined.
exec_memfd = true

# A process whose privileges the kernel raised as it executed: a setuid or
# setgid binary, or one with file capabilities
# (`binary_properties.privileges_changed`). This is privilege actually being
# GAINED, as distinct from `priv-setuid-chmod`, which sees a setuid bit being
# set -- something every package build does to its own staged files. Fires for
# every sudo and pkexec, so it is a chain step rather than a finding.
exec_privileges_raised = true

# The four rules below replaced the `pkg` kernel policies of the same names.
# Tetragon's `matchParentBinaries … followChildren` matched processes with no
# package manager in their ancestry at all (quickshell -> bash, Xwayland -> bash,
# make under cmake), so the "is this inside a package install?" decision moved
# into moatd, where the process table has exact ancestry and the real argv.
# The rule ids and severities did not change.

# A shell or interpreter exec'ing inside a package-manager subtree. Low, and
# folded to one alert per install — it is a timeline signal, not an incident.
pkg_subtree_interpreter_spawn = true

# curl/wget/base64/openssl (or python -c/-m and node -e with a URL) inside a
# package-manager subtree. High.
pkg_subtree_downloader = true

# nc/ncat/netcat/socat/telnet inside a package-manager subtree. Critical, and
# the one rule moatd enforces itself: in `enforce` mode it SIGKILLs the process
# after re-checking its start time. Monitor mode never kills.
pkg_subtree_netcat_exec = true

# claude/codex/gemini/opencode/q/amp started from inside an install. High.
ai_cli_in_pkg_subtree = true

[ai]
# Ancestors that are allowed to launch an AI CLI without a terminal, as globs.
# Matched against each ancestor's binary AND each of its arguments, so a shebang
# script (reported as `binary: /usr/bin/bash` with the script in `arguments`)
# still matches.
#
# Omarchy's own usage reporters run `codex` and `claude` headlessly by design,
# which is exactly the shape `moat-x-ai-cli-headless` looks for, so they ship
# allowed. Add your own cron jobs and CI wrappers here rather than turning the
# rule off.
headless_allowed_parents = [
  "/usr/share/omarchy/bin/omarchy-agent-usage-*",
]

[thresholds]
# Same rule + exe + file inside this many seconds folds into one alert with a
# `count` update instead of a new alert.
dedupe_secs = 60

# mass-read: this many distinct CREDENTIAL files inside the window fires (the
# Nth read is the trigger, not the N+1th).
# Counts only files the `cred-*` policies posted, so it is already
# scoped to credential-shaped reads rather than to file activity in general.
#
# 3 in 30s. Nothing legitimate reads four different credential kinds -- an npm
# token, an AWS key, a kube config -- inside half a minute; that is what a
# secret scanner does. The previous 40-in-10s could not fire at all.
#
# Backup and indexing tools (restic, borg, rsync, an editor indexing your home)
# will trip this. They are a small nameable set and the alert offers to allow
# them by binary, which is visible and reversible -- unlike a threshold set so
# high the rule is off.
mass_read_files = 3
mass_read_window_secs = 30

# How long an exited process stays in the table. Kprobe events can be written
# after the exit line, and kill confirmation arrives on the exit event.
process_prune_secs = 60

# Ancestry chain cap recorded on each alert.
ancestry_max = 8

# alerts.jsonl is renamed to alerts.1.jsonl at this size (20 MiB).
#
# Back to 20 MiB on 2026-09-05, once the panel stopped reading this file.
#
# It was cut to 4 MiB that afternoon because quickshell's FileView has no
# read-from-offset: every append had the panel re-read the whole live file on
# the UI thread, so the log's size was a latency budget and history was being
# traded for responsiveness. The panel now asks moatd for the folded feed over
# the control socket it already used for everything else, so this is once again
# only a question of how much history to keep -- and the answer for an EDR is
# "as much as is reasonable".
alerts_max_bytes = 20971520

# state.json write interval, and feed-file mtime poll interval.
state_interval_secs = 5
feeds_poll_secs = 60

[net]
# Destinations a package install may reach without an alert. There is no DNS in
# the kernel and no hostname in the export (TETRAGON-NOTES gap 4), so this is
# addresses only — coarse by necessity, which is why the rule is `medium`.
# Add your company mirror or private registry here.
registry_cidrs = [
  "151.101.0.0/16",   # Fastly: registry.npmjs.org, crates.io
  "199.232.0.0/16",   # Fastly
  "140.82.112.0/20",  # GitHub
  "143.55.64.0/20",   # GitHub
  "192.30.252.0/22",  # GitHub
  "185.199.108.0/22", # GitHub Pages / raw
  "104.16.0.0/12",    # Cloudflare: pypi.org and much else
  "172.64.0.0/13",    # Cloudflare
]

# RFC1918, loopback, link-local and CGNAT are allowed implicitly. Set false to
# Allow RFC1918 egress from inside a package install without alerting.
#
# Stays `true`, and should: an internal Artifactory, Nexus, Verdaccio or PyPI
# mirror is how a great many real installs work, and alerting on all LAN
# traffic would make moat useless in exactly the environments that most need it.
# Loopback is allowed unconditionally, whatever this says.
#
# It is not a blanket pass. A LAN address this machine has NEVER talked to
# before is not the registry you use every day, so a first-contact destination
# is still reported once. Your registry becomes ordinary within a few installs
# and goes quiet; a beacon to a host nobody has seen does not. On 2026-09-04 a
# simulated npm package opened a WebSocket C2 to 192.168.44.122 and the blanket
# exclusion said nothing at all.
allow_private = true

# Severity for a pkg-egress hit: critical | high | medium | low.
egress_severity = "medium"

[baseline]
# Baselining (docs/BASELINE.md). The product requirement behind this section:
# a quiet day produces zero notifications. 500 alerts a day means the user
# turns it off, so every alert here is a specific (rule, actor) decision the
# user can see, explain and reverse — never a blanket allowlist.

# Repos whose signature makes a package-owned binary `official`. AUR builds are
# in none of them by design: the June 2026 AUR wave installed pacman-owned
# binaries, so "pacman owns it" is not trust. Add a repo you actually trust.
trusted_repos = ["core", "extra", "multilib", "omarchy"]

# Days after the first run during which a recurring, official, medium/low
# pattern is written straight to allowlist.d/baseline.toml. After the window it
# becomes a proposal instead (`moatctl baseline list`). Restart the window with
# `moatctl baseline relearn --days N` after a new job or a new toolchain.
learning_days = 7

# Distinct days a (rule, actor, parent, dir) tuple must recur on before it can
# be learned or proposed. Three days is "this is how the machine works", not
# "this happened twice this afternoon".
learn_min_days = 3

# Alerts from one rule in a rolling 24 h before the noise guard demotes it to
# the timeline. The rule is never switched off: it keeps writing to
# alerts.jsonl, one `moat-x-noisy-rule` alert names the top five tuples, and the
# demotion clears itself after 24 quiet hours.
noisy_rule_per_day = 20

# BASELINE §2: let an official actor take one step off persist/priv/exec/net.
# cred, rootkit and shell never move — an official binary reading your SSH key
# is still worth a look — and a `pkg-install` context is never downgraded at all.
provenance_downgrade = true

[learning]
# Rarity counters (docs/LEARNING-AND-ANALYSIS.md §1). Not a model: four decayed
# per-tuple counters that answer "has this happened on this machine before".
# Rarity never changes a severity on its own; it is evidence, and a tuple must
# be `common` before the baseline will propose it.

# A sighting's weight halves this often. Raw totals never decay, so
# "seen 41 times since Aug 12" stays honest.
half_life_days = 30

# Under this many total sightings a tuple reads as `rare`.
rare_max_count = 3

# Nothing in this many days puts a tuple back to `rare`.
rare_max_age_days = 14

[analysis]
# docs/LEARNING-AND-ANALYSIS.md §2: hand an alert to the user's own agent.
#
# `moatctl analyze <id>` (and the panel's "Analyze with <agent>" button) writes
# <bundle_dir>/<alert id>/bundle.md and launches
#   omarchy-agent --prompt "<fixed preamble naming that path>"
# The preamble, not the bundle, is the prompt: the agent opens the file itself,
# and every process-derived string in it sits inside a ```DATA fence that the
# preamble tells the agent to treat strictly as data. That matters — the
# s1ngularity attack drove the victim's own AI CLIs, so an alert about a
# malicious postinstall must not become an injection channel.
#
# The daemon never launches an agent (no session, no terminal, runs as root);
# moatctl does, from the user's session.

# Per-agent flags for a read-only or plan mode (LEARNING §2 step 4).
#
# ADVISORY ONLY on Omarchy 4: /usr/share/omarchy/bin/omarchy-agent accepts
# exactly --inline, --pick and --prompt, rejects anything else, and builds each
# agent's own flags itself (`claude --permission-mode auto`, ...) with no
# environment variable to influence it. There is no pass-through, so
# `moatctl analyze` prints the equivalent direct command instead of dropping
# these silently.
agent_args = { claude = ["--permission-mode", "plan"] }

# Where bundle.md and the incident snapshots live: <bundle_dir>/<alert id>/.
# 0750 root:moat, so the panel and the agent (running as the user) can read
# them and only the daemon writes them. `moatd run --incidents-dir` overrides
# it for dev mode.
bundle_dir = "/var/lib/moat/incidents"

# --- auto-triage (LEARNING §2c) ----------------------------------------------
#
# The same evidence, handed to the same agent, on a timer, with nobody
# watching. `moat-triage.timer` runs `moatctl triage --run` from the user's
# session; the daemon only says what is waiting and decides what the answer is
# allowed to do.
#
#   off       never run.
#   annotate  attach the verdict to the alert and nothing else.
#   demote    also let a *benign* verdict at *high* confidence move an alert
#             from the notification badge to the panel timeline.
#
# What no mode can do, whatever the agent returns: hide, ack, delete, or
# re-severity an alert, write an allowlist file, or run a command. A proposed
# allowlist block is stored as text with an Accept button; nothing applies it.
# The ceiling lives in moatd's triage::decide, is re-checked daemon-side on
# every submission, and is under test.
#
# Know the tradeoff before leaving this on `demote`: the alerts worth triaging
# are the ones most likely to contain attacker-controlled text, so this is the
# one place where a successful prompt injection buys something — a move off the
# badge. It buys nothing beyond that, the alert stays in the panel and in the
# store, the outcome is recorded on the alert as `triage.outcome`, and
# `moatctl triage --undo <id>` reverses it.
#
# Unlike `moatctl analyze`, this path does NOT go through omarchy-agent, which
# launches every agent auto-approving (`claude --permission-mode auto`,
# `codex --approve-for-me`). Correct for a launcher a human is sitting in front
# of; wrong for an unattended run over content under suspicion. moat resolves
# the same default agent and builds a read-only, non-interactive invocation
# itself. An agent with no such mode is not run at all — today that means
# claude and codex work and the rest report why they do not.
auto_triage = "demote"

# The highest severity a triage demotion may touch. `critical` is the one place
# where being wrong is unrecoverable in the moment, so the default leaves it on
# the badge and lets the agent explain it instead.
triage_demote_max_severity = "high"

# How long an alert must have existed before it is offered to an agent.
#
# The buffer in "buffer, dedupe, then react". A package install fires several
# alerts within a couple of seconds; reading the first while the rest are still
# arriving spends a call on a partial picture. Waiting lets the burst settle so
# one read covers it.
triage_settle_secs = 20

# PATTERNS per run, not alerts. The queue is deduplicated by the same
# (rule, actor, parent, dir) tuple the baseline and the noise guard use, so ten
# alerts of three shapes is three questions. The others inherit the verdict on
# the next pass rather than each buying their own.
triage_max_per_run = 3

# Wall-clock ceiling for one agent call. On expiry the child is killed and the
# alert is left exactly as it was.
#
# Measured, not guessed: an agent in plan mode reading one bundle plus its
# staged evidence takes about three minutes, and the first live run on this
# machine landed at 172s. A ceiling near that turns a normal answer into a
# killed child and a wasted call, so this sits well clear of it.
#
# triage_max_per_run x triage_timeout_secs is the worst case for one pass, and
# moat-triage.service's TimeoutStartSec has to stay above it.
#
# Lowered from 600 on 2026-09-04. The service is Type=oneshot, so a pass holds
# the queue: at 600 one pass could block every other alert -- including a live
# attack -- for half an hour. 300 is still well over the measured normal.
triage_timeout_secs = 300

[incidents]
# LEARNING §4: capture before it is gone. On an alert at or above this severity
# the daemon copies /proc/<pid>/{status,cmdline,environ,cwd,exe,fd}, the process
# tree, the tree's sockets (parsed from /proc/net, never `ss`), the executed
# binary and the alerted file — BEFORE anything is killed, because in enforce
# mode the process is about to stop existing. Environment values that look like
# credentials are masked.
#
# `critical` narrows it to the loudest alerts; `never` switches capture off.
snapshot_min_severity = "high"

# Snapshots are deleted when they are older than this many days...
retain_days = 30

# ...or when there are more than this many, oldest first.
retain_max = 200

[content]
# When a chain reaches `high`, look at what is actually IN the files it
# implicated: type from magic bytes, ELF imports and needed libraries, the
# shebang and obfuscation vocabulary of a script, embedded URLs and addresses
# with the private/loopback ranges classified, printable strings, and Shannon
# entropy over the file and per section. The findings are attached to the alert
# as evidence and rendered into bundle.md inside DATA fences.
#
# This is deliberately NOT an anti-virus. Nothing is scanned on write, on exec,
# or on a timer; the only trigger is a sequence the correlator already
# concluded was worth escalating. Findings never change a severity — they
# annotate one.
#
# Credential paths (evidence.rs::is_secret_path) and anything under
# /var/lib/moat are never read, whatever asks.
enabled = true

# Files bigger than this are listed as skipped, with the reason, and never read.
# 8 MiB is the same cap the incident capture already uses for a binary, so this
# adds no new class of cost to the event thread. Measured on this machine
# (release build, warm page cache): a 4.9 MB ELF costs 20.5 ms to inspect plus
# 1.8 ms to hash — about 4.4 ms per MB — so a file at this cap costs ~36 ms, and
# a chain analyses at most 4 files per pass.
max_bytes = 8388608

# Analyses per rolling hour, counted from the first one and persisted through
# state.json so a restart cannot refill the allowance. A high chain is rare by
# design; reaching this cap means something is wrong, and the right response to
# that is to stop reading files rather than to keep up.
per_hour = 40

[digest]
# LEARNING §5: one notification a week — "moat: 0 incidents, 18 installs
# watched, 3 baseline proposals to review" — and the only scheduled
# notification moat ever sends. Its job is to say the thing is on and working.
#
# The daemon computes it and publishes it in state.json; delivery is the user
# timer moat-digest.timer running `moatctl digest --notify`, because desktop
# notifications belong to the user's session and not to a root service.
#
# `moatctl set digest off` flips the switch in state.json without touching this
# file or systemd; this key is only the first-boot default.
enabled = true

# Local weekday and hour. Local, not UTC: "Monday 9am" is a promise about the
# user's morning.
weekday = "monday"
hour = 9

[telemetry]
# Selectable telemetry classes (docs/SHIPPING.md).
#
# An alert is a claim; telemetry is the record you go back to when the claim was
# never made. moat has always collected the second kind — Tetragon exports every
# exec and exit on this machine — but it went into /var/log/moat/tetragon.log,
# 0600 root:root, rotated away in half an hour. Full telemetry nobody could
# query. These switches turn it into named streams that land in
# /var/lib/moat/telemetry.jsonl (0640 root:moat), which `moat-ship` can send
# somewhere it survives.
#
# EVERY NUMBER BELOW WAS MEASURED ON THIS MACHINE, not estimated. See
# docs/SHIPPING.md section 4 for how.
#
# Changing `network` or `file` changes what the KERNEL is asked to do, which
# means new policy files and a Tetragon restart. Do it with:
#
#     sudo moatd telemetry --apply
#
# That command validates the config, renders the policies, re-runs
# policies/check.py over what it wrote, restarts tetragon then moatd in that
# order, and then VERIFIES that the policies came back pinned in the kernel.
# Editing this file and restarting by hand skips every one of those steps, and
# a bad policy load is a silent outage: on 2026-09-03 the sensor was dead for 25
# minutes while systemd, the gRPC socket and the export log all read "running".
#
# `process` and `alerts` need no policy and no restart: SIGHUP is enough
# (`systemctl reload moatd`).

# alerts.jsonl as it is today. A handful of records a day, every one of them
# something a person would want to read. Leave this on.
alerts = true

# exec/exit with parent mapping.
#
# ALREADY EXPORTED whatever you set here: exec cannot be filtered in the kernel
# (TETRAGON-NOTES section 10), so Tetragon writes it either way. This switch
# only decides whether moatd ALSO writes a compact projection that can be
# shipped and queried.
#
# Measured: 42 events/s, ~3.1 KB each in the raw export = 127 KB/s = 11 GB/day,
# which is why the raw log rotates every 6-7 minutes. The projection below is
# ~450 bytes for an exec and ~150 for an exit, so about 1.4 GB/day. Still the
# most expensive class by an order of magnitude. Off.
process = false

# Outbound connects, from moat-telemetry-network-connect.
#
# Measured: 0.26 connects/s against exec's 42/s — 160x cheaper — because
# private, loopback and link-local destinations are excluded in the kernel.
# About 8 MB/day. This is the class that answers "what did this machine talk to
# on Tuesday" and it is affordable. Off by default because shipping anything is
# a decision, not because it is expensive.
network = false

# Executable-shaped file writes and chmod +x, from moat-telemetry-file-*.
#
# The expensive one, and the one that had to be designed rather than switched
# on. Measured during an `npm install` of 171 packages:
#
#   every write under $HOME .................. 42.3 events/s
#   this class's KERNEL filter ............... 19.2 events/s   (45%)
#   after the create/modify ladder ............ 0.32 events/s  (0.8%)
#
# The kernel filter alone is not enough. What makes it affordable is that the
# class is keyed on the FILE rather than on the operation:
#
#   create of something executable-shaped ......... recorded
#   modify of something that already existed ...... recorded, and worth more
#   create inside a build tree ..................... dropped (quiet_creates_under)
#   anything else .................................. never seen by the kernel
#
# The second line is the point. On 2026-09-04 a simulated npm package took a
# command over a WebSocket and rewrote its own node_modules/express/index.js so
# the payload would survive every future require(). moat said nothing. An
# installed script being rewritten after install is close to unambiguous, and no
# amount of "log every write" would have made it findable.
file = false

# Repeat the whole parent block on every exec record, as the raw export does.
# Off: parent_exec_id plus a join at the collector is the same graph for roughly
# half the bytes. Turn it on for a collector that cannot join.
inline_parent = false

# --- file class scope --------------------------------------------------------
# These become the kernel policy's own Prefix and Postfix lists, so the
# filtering happens before anything is written to disk — it saves the export
# write and moatd's parse as well as the collector's storage. {{HOME}} fans out
# over every human home in /etc/passwd.
#
# Locations where ANYTHING written is worth a record, whatever it is.
file_scope = [
  "/usr/bin/",
  "/usr/local/bin/",
  "/usr/lib/systemd/system/",
  "/etc/systemd/system/",
  "/etc/cron.d/",
  "/etc/profile.d/",
  "{{HOME}}/.local/bin/",
  "{{HOME}}/.config/systemd/user/",
  "{{HOME}}/.config/autostart/",
  "{{HOME}}/.local/share/applications/",
]

# Suffixes that make a file executable-shaped anywhere on the system. ELF
# magic-byte detection is not expressible in a kernel selector, so moatd reads
# the first four bytes in userspace on the paths these already caught — a
# `chmod +x`'d binary with no extension still comes out `shape: "elf"`.
file_suffixes = [
  ".sh", ".bash", ".zsh", ".py", ".pl", ".rb",
  ".js", ".mjs", ".cjs", ".ts", ".php", ".lua",
]

# Path fragments under which a CREATE is not recorded. This is where the 19/s
# becomes 0.32/s: build and cache trees are almost all of the volume and almost
# none of the value.
#
# NEVER applied to a modify. A rewrite of node_modules/<pkg>/index.js is exactly
# what this class exists for, and suppressing it here would delete the one
# finding that made the class worth having.
quiet_creates_under = [
  "/node_modules/",
  "/.cache/",
  "/.npm/",
  "/target/",
  "/.git/",
  "/__pycache__/",
  "/.venv/",
  "/site-packages/",
  "/.local/share/mise/",
  "/.cargo/registry/",
]

# A file whose birth time (statx btime) is younger than this counts as a create.
# 0 means "call everything a modify".
create_window_secs = 5

# Attach the body of a small script to its record.
#
# OFF, and think before turning it on: this is the only switch in moat that puts
# file CONTENTS anywhere they can leave the machine. It is worth having — the
# body of a freshly written dropper is the evidence — and it inherits
# evidence.rs's is_secret_path wholesale, so a path that looks like key material
# is never read no matter what. Text only; an ELF is described, never carried.
capture_body = false
capture_body_max_bytes = 65536

# telemetry.jsonl is renamed to telemetry.1.jsonl at this size (16 MiB).
max_bytes = 16777216

# ----------------------------------------------------------------- [contain]
#
# Correlation-driven containment. OFF by default, and deliberately so: it is
# the only thing moat does on its own judgement rather than on a single rule you
# armed, so it asks first.
#
# What it does: when chain correlation concludes a sequence is `high` AND that
# sequence includes a connection to a destination this machine had never used,
# moatd writes a TracingPolicy naming that one binary and that one destination,
# loads it with `tetra tracingpolicy add`, and deletes it when the TTL expires.
# The connection is refused with EPERM. Nothing is killed, nothing else on the
# machine is affected, and `moatctl contain` lists what is live.
#
# Why it exists: `moat-net-tmpfs-binary-egress` cannot enforce against a LAN
# address, because a kernel selector cannot tell your own package registry from
# a C2 on the same subnet. Userspace can -- it knows the destination is a first
# contact and that it happened inside a correlated sequence -- so the decision
# is made there and the enforcement handed back to the kernel.
[contain]
enabled = false
# Ending processes a chain implicates: off | log | kill.
#
# `log` by default, and deliberately. A design review on 2026-09-05 ran the
# first version of these rules against this machine's own records: they would
# have SIGKILLed the developer's own build four times that day, thirteen
# processes at a time, while failing to kill the lab payload they were written
# for. Rules for an action with no undo get judged against real traffic before
# they act -- which is how the industry ships this too: detect first, promote to
# prevent after a tuning period.
#
# `log` runs the whole decision and writes "WOULD HAVE KILLED ..." to the
# journal. A week of that with nothing wrong in it is the argument for `kill`.
# Requires `enabled = true` for the containment half; the log half runs anyway.
kill = "log"
# Minutes, not hours: long enough to stop an exfil in progress, short enough
# that a wrong call costs one failed connection and then fixes itself.
ttl_secs = 600
# These share the `socket_connect` LSM hook with the detection policies, and the
# kernel caps how many policies one hook can carry. The oldest containment is
# released to make room rather than being allowed to accumulate until a
# detection policy fails to load: running out of room must never cost coverage.
max = 4
