# Group whose members may read alerts.jsonl and use the control socket.
# After installing: sudo usermod -aG moat $USER, then log out and back in.
g moat -

# The shipper. No shell, no home, no capabilities: it reads two 0640 root:moat
# files through its supplementary `moat` group and writes one cursor. It is a
# separate identity from the daemon on purpose — moatd runs as root with the
# kernel sensor attached, and nothing that talks to a remote endpoint should
# share that.
u moat-ship - "Moat log shipper" - -
