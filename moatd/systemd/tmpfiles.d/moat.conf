# Type Path                          Mode UID  GID      Age Argument
d /var/lib/moat                  0750 root moat -   -
d /var/lib/moat/feeds            0750 root moat -   -
# Incident snapshots (LEARNING §4) and the bundle.md the AI analysis reads.
# 0750 root:moat: the panel and the user's agent read them, the daemon writes
# them. Unlike quarantine, the group needs read access — that is the whole
# point of a bundle.
d /var/lib/moat/incidents        0750 root moat -   -
# Quarantined files are root-only: nothing in the moat group should be able
# to read a sample back out, let alone re-execute it.
d /var/lib/moat/quarantine       0700 root root     -   -
d /var/log/moat                  0750 root moat -   -
d /run/moat                      0750 root moat -   -
d /run/moat/policies             0750 root moat -   -
# Created empty so the plugin can tail it before the first alert exists.
f /var/lib/moat/alerts.jsonl     0640 root moat -   -
