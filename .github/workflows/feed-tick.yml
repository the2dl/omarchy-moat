# Runs the malicious-package feed's ingest on a schedule.
#
# This exists because Cloudflare's own Cron Triggers do not fire for this
# Worker. Both triggers are registered, the dashboard lists them with a
# next-run time, and on 2026-09-10 not one of them ever executed: no tail
# event, no R2 heartbeat written before any work, and state.json frozen across
# four boundaries with no deploy to blame. Rather than keep debugging somebody
# else's scheduler, the schedule moved here.
#
# One piece of evidence looked like the opposite and was not. Cloudflare's own
# analytics showed invocations at 13:00, 13:15, 13:45, 14:00, 14:30, 15:00 and
# 15:30 -- every quarter hour. Those were moat's OWN client: moat-feeds.timer is
# OnCalendar *:00/15 with RandomizedDelaySec=5min, so an installed machine polls
# the pointer at every quarter hour a few minutes late. 15:18 is 15:15 plus
# three minutes of jitter. The heartbeat settled it -- it is the first statement
# of the scheduled handler and state/last-cron.txt has never existed.
#
# Ruled out with a measurement each: the Free plan (the account is Paid), a
# partial deployment (100%), a missing handler (`scheduled(` is in the script
# pulled back from the API, not just the local source), and propagation delay
# (the last two boundaries had no deploy within 40 minutes).
#
# Then a control ruled out this Worker entirely. A throwaway Worker `cron-probe`
# -- no bindings, no routes, no R2, a `scheduled()` that only console.logs, cron
# `* * * * *` -- was deployed at 15:41:27Z and had run zero times by 15:51Z, ten
# boundaries later. Analytics was reporting fine over the same window (it showed
# every one of moat's own pointer fetches). So automatic dispatch is broken for
# the account, not misconfigured for moat-feed-aggregator, and nothing in this
# repository can fix it. That makes it a Cloudflare support ticket, and this
# workflow the answer in the meantime rather than a stopgap.
#
# GitHub's cron is not punctual either -- it can drift five to fifteen minutes
# under load, and skips runs on a repository that has been idle for 60 days.
# Neither matters much: upstream (OSSF, DataDog) only moves every hour or two,
# and a late tick costs freshness, never correctness. Clients keep the last
# index they verified.
name: feed tick

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Run a full rebuild instead of an incremental tick'
        type: boolean
        default: false

concurrency:
  # Two ingests writing R2 at once would race on the sequence number.
  group: feed-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run the ingest
        env:
          TOKEN: ${{ secrets.FEED_TRIGGER_TOKEN }}
          FULL: ${{ inputs.full }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "FEED_TRIGGER_TOKEN is not set; nothing to authenticate with" >&2
            exit 1
          fi
          path=/admin/tick
          [ "$FULL" = "true" ] && path=/admin/rebuild
          code=$(curl -sS --max-time 540 -o /tmp/out.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $TOKEN" \
            "https://feed.runts.net$path")
          echo "HTTP $code"
          cat /tmp/out.json
          # A tick that changed nothing is a success, so only the status decides.
          [ "$code" = "200" ]
